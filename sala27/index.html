e il tabellino 1-2 messo nel motivo. Mercato giusto: l'Under 2.5 a 2,30 scartato sarebbe morto proprio sull'1-2, la linea 3.5 lo lasciava vivo. Stima 74 contro 65,4: calibrata, il margine c'era. Le frequenze contate hanno battuto i modelli sull'Over (61-69%): primo Under della stagione, vinto."},{"data":"2026-10-17","schedinaId":"S27-D30-A","partita":"Eintracht Frankfurt — FC Köln","famiglia":"gol (Gol)","datoDecisivo":"difesa del Frankfurt (16 subiti in 5) più attacco del Köln (a segno 8 su 8): la condizione del Gol era rispettata","lezione":"Gol perso 1-0 (Ebnoutalib al 77' su assist di Aséko; sportschau, hessenschau, sky.de). Lettura sbagliata sul lato che sembrava più solido: il Frankfurt, che aveva preso gol in tutte e cinque, ha chiuso la porta in casa al primo tentativo dopo lo 0-6 col Lipsia, e il Köln senza tre difensori ha giocato per non perdere. Una difesa che ha appena subito una goleada spesso si chiude nella gara dopo: la serie 'subisce sempre' era gonfiata da due partite (0-6 e 1-4). Mediana, non media, anche qui. Mercato: l'Over 2.5 scartato sarebbe morto uguale, l'1X Frankfurt sarebbe passato. Stima 76 contro 75,2: margine 0,8, quasi nullo."},{"data":"2026-10-17","schedinaId":"S27-D30-A","tipo":"conferma","partita":"Deportivo La Coruña — Levante","famiglia":"esiti (doppia chance 1X)","datoDecisivo":"Levante senza vittorie fuori (2 punti in 4 trasferte, 3 vittorie nelle ultime 20)","lezione":"1-1 (Nsongo Bil 63', Requena 82'; riazor.org, elgoldigital, infobae): l'1X ha retto proprio sul pareggio che avevo scritto come rischio del segno secco, scartato a 2,05. Mercato giusto: il 2,05 sarebbe morto all'82'. Stima 79 coerente."},{"data":"2026-10-17","schedinaId":"S27-D30-B","tipo":"osservazione","partita":"Holstein Kiel — Hertha BSC","famiglia":"esiti (DNB)","datoDecisivo":"serie dell'Hertha (7 su 7) contro il Kiel ultimo che in casa pareggia","lezione":"0-0, rimborso (sportschau, herthabsc.com, berliner-zeitung, sky.de). Hertha 15 tiri a 6 e quattro palle gol, portiere del Kiel decisivo. Il DNB ha fatto il suo lavoro: il pareggio che avevo scritto come risultato preferito del Kiel non è costato niente. Il 2 secco scartato a 2,20 sarebbe stato perso."},{"data":"2026-10-18","schedinaId":"S27-D31-A","partita":"Southampton — Bolton Wanderers","famiglia":"gol (Over 2.5)","datoDecisivo":"Bolton Over 2.5 in tutte le 4 trasferte contate, Southampton cinque vittorie interne di fila","lezione":"0-0 (skysports, southamptonfc.com, sportinglife). xG 2,19 contro 1,53: le occasioni c'erano (tre gol a porta vuota sbagliati, Larin fuori nel primo tempo), il gioco ha confermato la lettura, la mira no. Ma il lato debole scritto nel motivo era proprio quello: Southampton tre gol nelle ultime tre e due porte inviolate di fila. Quando la squadra di casa arriva con il trend recente opposto alla serie stagionale (meno gol, più porte chiuse), conta il trend: le ultime 3 pesano più delle ultime 10 sul mercato gol. Mercato: tutti i mercati gol sarebbero morti, l'1 a 1,42 pure; solo l'Under avrebbe pagato. Stima 75 contro 71,4: troppo alta di qualche punto visto il trend."},{"data":"2026-10-18","schedinaId":"S27-D31-B","tipo":"conferma","partita":"Telstar — Feyenoord","famiglia":"esiti (2 secco)","datoDecisivo":"Feyenoord quattro vittorie esterne di fila, Telstar mai vincente in casa con 11 gol subiti in 4","lezione":"3-4 (hbpmedia, nos, oddalerts): Diarra al 1', Steijn doppietta, Telstar tre volte sotto e tre volte a segno. Lettura giusta sul segno, sbagliata sulla porta: le sette assenze difensive scritte come lato debole hanno pesato tutte, e il Win to nil a 2,63 scartato per quel motivo sarebbe morto. Il 2 secco ha retto perché chiedeva solo di segnare uno in più, non di non subire. Stima 77 calibrata. Esiti con prova contata casa/trasferta: 7 su 7."},{"data":"2026-10-19","schedinaId":"S27-D32-A","tipo":"conferma","partita":"Red Bull Salzburg — SCR Altach","famiglia":"esiti (1 secco)","datoDecisivo":"Salzburg 4 su 4 in casa (13-2) contro Altach 0 punti e 0 gol in 4 trasferte","lezione":"3-0 (laola1, bundesliga.at, oe24): Tabakovic al 6', Lindström su punizione al 73', Redzic al 90'. Lettura giusta, mai in discussione. Mercato giusto: il No Gol a 2,05 scartato perché poggiava su una negazione sarebbe passato anche lui, ma l'1 reggeva anche un 2-1. Stima 80 contro 74,1: calibrata. Esiti con prova contata casa/trasferta: 8 su 8."},{"data":"2026-10-19","schedinaId":"S27-D32-B","partita":"Celtic — Hearts","famiglia":"gol (Under 3.5)","datoDecisivo":"Celtic Under 3.5 nelle ultime 6 di campionato e Hearts in 5 delle ultime 6","lezione":"7-1 (skysports, vavel, celtsarehere): due palle inattive nei primi dieci minuti, 5-1 all'intervallo. Ho contato l'Under solo nelle gare di campionato del Celtic e ho messo come 'lato debole' i due numeri che contavano davvero: 11 gol subiti dal Celtic nelle ultime 5 di tutte le competizioni e l'Hearts miglior attacco del campionato (19 in 8). Un Under tra la squadra più prolifica e una difesa che sta perdendo gol a grappoli scommette contro tutte e due le tendenze recenti. È la regola del trend corto rovesciata: vale anche per l'Under. Mercato: tutto ciò che era Under sarebbe morto; l'Over 2.5 a 1,50 scartato perché sotto il modello avrebbe pagato. Stima 70 contro 59,9: troppo alta, il modello guardava la stagione e non le ultime cinque."},{"data":"2026-10-20","schedinaId":"S27-D33-A","partita":"Newell's Old Boys — Central Córdoba","famiglia":"gol (Under 2.5)","datoDecisivo":"Newell's Under 2.5 in 8 delle ultime 10 interne, Central Córdoba in 6 delle ultime 10 trasferte","lezione":"2-1 (conclusion.com.ar, lacapital.com.ar, elciudadanoweb): Gómez Mattar al 31', Solari, Sequeira di testa al 79'. Il gol della bandiera al 79' ha ucciso l'Under, mentre l'1 Newell's a 1,81 scartato avrebbe pagato. Terzo mercato gol perso di fila (Southampton Over, Celtic Under 3.5, Newell's Under 2.5): l'Under chiede a due squadre di non fare una cosa per 90 minuti, cioè una prova per negazione travestita da frequenza. Il segno sulla squadra che stavo già studiando era la lettura giusta."},{"data":"2026-10-21","schedinaId":"S27-D34-A","tipo":"conferma","partita":"Roma — Slovan Bratislava","famiglia":"esiti (handicap asiatico -2)","datoDecisivo":"Slovan 9 gol subiti in 2 gare di Champions e Roma 13 gol nelle ultime 5 in casa","lezione":"4-0 (sky sport, eurosport, corriere dello sport): Hermoso 22', Molina 39', Pisilli 53', Malen su rigore 58', più un gol di Castro annullato per fuorigioco. Lettura giusta: il tabellino più probabile 3-0 e la difesa dello Slovan a pezzi erano il dato vero. Mercato giusto: l'1 a 1,15 era fuori range, il -2 asiatico pagava il doppio con il rimborso sul 2-0 come rete. Stima 52 contro 50: calibrata, forse prudente. Primo giorno con l'obiettivo 200 €: la quota 2,00 sugli esiti funziona quando il divario è misurato in gol subiti, non in nomi."},{"data":"2026-10-22","schedinaId":"S27-D35-A","partita":"Inter — Shakhtar Donetsk","famiglia":"gol (Gol/No Gol)","datoDecisivo":"Shakhtar a segno nelle ultime 6 e nelle ultime 5 trasferte","lezione":"1-0 (ESPN, Sky Sport): Carlos Augusto al 77', Bastoni espulso al 68', Martinez salva nel finale. La prova \"lo Shakhtar segna sempre\" era fatta quasi tutta contro squadre ucraine di seconda fascia (Kolos, Veres, Cherkasy, Chornomorets): forma non pesata sul livello degli avversari, cioè il punto 1 dello studio obbligatorio saltato di fatto. La difesa bucata dell'Inter era contro Brugge e Udinese, non contro una squadra che in Europa tiene palla poco. Lettura sbagliata sul lato debole già scritto (Shakhtar Gol solo nel 33%). Mercato: il Gol chiedeva due cose, il segno 1 a 1,18 era fuori range: andava cercato un esito o un team total sull'Inter. Stima 61 contro 57: troppo alta. Regola pratica: per il Gol la squadra che segna meno deve aver segnato contro avversari di livello pari o superiore a quello di oggi, non contro il fondo del suo campionato."},{"data":"2026-10-23","schedinaId":"S27-D36-A","tipo":"conferma","partita":"Flamengo — Estudiantes","famiglia":"esiti (handicap asiatico +1,5)","datoDecisivo":"Nessuna vittoria del Flamengo con due gol di scarto negli ultimi 5 precedenti, Flamengo senza Arrascaeta","lezione":"0-0 dopo 90 minuti, Estudiantes in finale 3-2 ai rigori con tre parate di Muslera (flamengo.com.br, lance, vavel). Lettura giusta: il Flamengo senza Arrascaeta non ha trovato il gol contro un Estudiantes che in coppa tiene la porta chiusa. Mercato giusto: il segno 1 a 1,40 avrebbe perso, il +1,5 era il mercato che sopravviveva a 0-0, 1-0, 1-1 e sconfitta. Stima 58 contro 52,4: calibrata, forse prudente. Seconda conferma per l'handicap misurato sui precedenti e sui gol, non sui nomi (dopo Roma -2)."},{"data":"2026-10-24","schedinaId":"S27-D37-A","partita":"Alavés — Málaga","famiglia":"gol (Gol/No Gol)","datoDecisivo":"Málaga un solo gol in 4 trasferte, a secco in 3","lezione":"1-1 (eurosport.es, kirolakeitb, 101tv): Adrián Niño al 44', Mañas all'89' su ribattuta, con un fallo precedente non rivisto al VAR. La prova reggeva su quattro trasferte del Málaga, mentre sul totale stagionale il Málaga aveva segnato in 5 gare su 9: il campione grande diceva Gol al 55%, quello piccolo No Gol, e ho creduto al piccolo. È lo stesso errore dello Shakhtar due giorni fa rovesciato: Gol/No Gol deciso su uno split di 3-4 gare. Mercato: l'1 Alavés a 1,65 avrebbe perso anche lui; il mercato che sopravviveva era sul Málaga (X2 o +1,5). Stima 59 contro 55,6: troppo alta, la correzione di -3 punti non bastava."},{"data":"2026-10-24","schedinaId":"S27-D38-A","partita":"Lazio — Parma","famiglia":"esiti + gol (vince a zero, 1 + No Gol)","datoDecisivo":"Parma a secco in 4 gare su 7, Lazio porta inviolata in 4 su 7","lezione":"2-1 (Sky Sport, DAZN, Virgilio): Taylor al 50', autogol di Diego Carlos al 58', poi Lontani al 95'. La Lazio ha vinto come previsto, ma il gol del Parma nel recupero ha fatto perdere la giocata. Il segno 1 da solo avrebbe pagato. Terzo Gol/No Gol perso in quattro giorni (Shakhtar, Málaga, Parma), e due volte su tre è stato un gol nel finale. Il No Gol chiede a una squadra di non segnare per 95 minuti: è una prova per negazione, e una partita già decisa la smonta proprio alla fine. Il lato debole era scritto nel motivo: la Lazio aveva preso gol in casa in 2 gare su 3. Ho chiamato \"vince a zero\" un mercato che conteneva il No Gol giocato il giorno prima. L'utente ha ragione: era una fissazione."},{"data":"2026-10-26","schedinaId":"S27-D39-A","tipo":"conferma","partita":"Hibernian — Celtic","famiglia":"esiti (handicap asiatico -1)","datoDecisivo":"Celtic 8 vittorie nelle ultime 10 trasferte, Hibernian 1 vittoria nelle ultime 10 in casa","lezione":"1-2, rimborso (hibernianfc.co.uk, Sky Sports, the42): Elding al 3', autogol di Kerr, Duran prima dell'intervallo. Lettura giusta sul vincitore, il Celtic ha vinto in rimonta col vento forte (28 tiri, 6 in porta). Il tabellino più probabile scritto nel motivo era proprio 1-2, cioè il rimborso: il -1 ha protetto, il -1,5 avrebbe perso, il segno 2 a 1,57 avrebbe pagato poco. Mercato giusto per la quota, calibrazione corretta: 55 stimato, scarto di un gol come da modello (24% di vittoria di misura). Il giovedì europeo perso col Celta si è sentito nel gioco ma non nel risultato."},{"data":"2026-10-27","schedinaId":"S27-D40-A","tipo":"conferma","partita":"Rizespor — Trabzonspor","famiglia":"esiti (segno 2)","datoDecisivo":"Trabzonspor 5 vittorie di fila in tutte le competizioni, quota scesa da 1,93 a 1,85","lezione":"3-4 (espn.com): lettura giusta sul vincitore, scenario sbagliato. Il Rizespor a secco in casa ha segnato tre gol (doppietta di Borrelli), il Trabzon ne ha fatti quattro in rimonta. Il segno secco era il mercato giusto: qualunque mercato sui gol della favorita o sull'handicap avrebbe tremato fino all'83'. Calibrazione: 55 stimato, vinta. Il movimento della quota a favore si conferma un dato utile."},{"data":"2026-10-27","schedinaId":"S27-D40-B","tipo":"conferma","partita":"Boulogne — Reims","famiglia":"esiti (DNB)","datoDecisivo":"Reims 5 pareggi in 9, per questo DNB e non segno","lezione":"1-1 (espn.com): rimborso. Boulogne avanti al 35', pari di Fofana all'84'. Il dato dei pareggi del Reims scritto nel motivo era quello giusto: il DNB ha salvato i 5 € che il segno 2 a 2,10 avrebbe perso. Mercato corretto, lettura a metà: il Reims ha faticato più del previsto contro un Boulogne che in casa non vince."},{"data":"2026-10-28","schedinaId":"S27-D41-A","tipo":"conferma","partita":"Torino — Como","famiglia":"angoli (team corners over 4.5)","datoDecisivo":"Como 7,6 angoli battuti a gara, Torino in casa 5,7 concessi","lezione":"1-3 (tg24.sky.it, calcionews24), angoli Como 6 e Torino 5 (tabella statistiche di diariodelweb, dati Football Italia; una sola fonte col conteggio). Il Como sotto 1-0 fino al 78' ha spinto e chiuso il Torino: lo scenario di chi deve rimontare gonfia gli angoli, non li toglie. Calibrazione: 66 stimato, 6 angoli contro i 5,8 attesi, cioè il tabellino previsto. Mercato giusto: il segno 2 a 1,70 avrebbe pagato lo stesso ma tremando fino all'82'."},{"data":"2026-10-28","schedinaId":"S27-D41-B","tipo":"conferma","partita":"Sassuolo — Lazio","famiglia":"esiti (handicap asiatico -0.25)","datoDecisivo":"Lazio 4 vittorie di fila e 7 vittorie nelle ultime 10 trasferte","lezione":"2-6 (tg24.sky.it): lettura giusta e larga, Lazio avanti 0-3 al 16'. Il -0,25 non è servito, il segno 2 a 2,08-2,23 avrebbe reso di più: con una favorita in serie e quota sopra 2,00 il pareggio protetto costa circa 30 centesimi di quota. Calibrazione: 57 stimato, vinta. Il lato debole scritto (il Sassuolo forte in casa) non ha pesato contro una squadra prima in classifica."},{"data":"2026-10-29","schedinaId":"S27-D42-A","tipo":"errore","partita":"Genoa — Juventus","famiglia":"esiti (segno secco in trasferta)","datoDecisivo":"Genoa 0,75 gol a gara e 0V 1N 4P contro le squadre sopra di lui","lezione":"2-0 per il Genoa (sport.sky.it). La lettura poggiava sulla debolezza del Genoa, ma il lato debole scritto nel motivo era più pesante: Juve senza Yildiz, Conceição, Locatelli e Thuram, con l'Europa League nelle gambe. Stima 56 contro 57,1, già sotto la quota: era una giocata senza margine fatta solo per riempire la giornata. Calibrazione: troppo alta. Con quattro titolari offensivi o di centrocampo fuori, la favorita in trasferta non si gioca sul segno secco."},{"data":"2026-10-30","schedinaId":"S27-D43-A","tipo":"conferma","partita":"Fiorentina — Atalanta","famiglia":"gol totali (Over 2.5)","datoDecisivo":"Atalanta 14 subiti nelle ultime 6 e senza tre centrali, Fiorentina 2,4 subiti a gara","lezione":"2-2 (ansa.it, virgilio.it): De Ketelaere 41', Njie 53', João Mário 61', Zalewski 74'. Lettura giusta: due difese bucate, quattro gol. Il lato debole scritto (la Fiorentina in casa segna poco) non ha pesato perché la prova stava sulla difesa dell'Atalanta, non sull'attacco viola. Calibrazione: 64 stimato contro 63,7, vinta. Le assenze di reparto (tre centrali) si confermano il dato più forte per i mercati gol."},{"data":"2026-10-30","schedinaId":"S27-D43-B","tipo":"conferma","partita":"Frosinone — Lecce","famiglia":"altro (squadra che segna per prima)","datoDecisivo":"Frosinone 9 gol nei primi 30 minuti, Lecce 8 subiti nel primo tempo","lezione":"5-1 (quotidianodelsud.it, rtl.it): Cichella al 25', nella finestra indicata dal dato. Lettura giusta e larga. Un dato di tempo (gol nei primi 30 minuti contro gol subiti nel primo tempo) ha deciso una giocata: diventa voce da cercare quando si valuta il mercato del primo gol. Calibrazione: 60 stimato contro 63,7, vinta; il precedente dei sei confronti senza sconfitte del Lecce non ha pesato con rose diverse, come dice la regola sui precedenti."},{"data":"2026-10-31","schedinaId":"S27-D44-A","tipo":"conferma","partita":"Casa Pia — Sporting","famiglia":"esiti (handicap asiatico -1.5)","datoDecisivo":"Casa Pia 0,4 gol a gara in casa e Sporting a segno almeno due volte to nel motivo (dieci assenti, quattro gare senza vittorie, xG concessi 2,0) pesava più della serie negativa del Parma. Seconda volta in sei giorni dopo Genoa-Juventus: una favorita decimata e senza vittorie, giocata con la stima già sotto la quota (65 contro 66,7), perde. Il dato del Parma era una prova sulla debolezza dell'avversario, non sulla forza della favorita. Calibrazione: troppo alta."},{"data":"2026-11-04","schedinaId":"S27-D48-A","tipo":"conferma","partita":"Barcellona — Aston Villa","famiglia":"gol di squadra (team total over 2.5)","datoDecisivo":"Barcellona 3+ gol in 11 delle 14 ufficiali e gol attesi 3,2 del modello","lezione":"3-0 (fcbarcelona.com, sportschau.de): Yamal al 7', doppietta di Raphinha. Lettura giusta: il team total chiedeva una cosa sola a una squadra sola, e la Villa che fuori concede poco non è contata perché l'attacco di casa era intero. Calibrazione: 63 stimato contro 64,5, vinta al limite (terzo gol al 64'). Il team total sulla favorita con attacco sano si conferma la risposta giusta quando il segno paga sotto 1,50."},{"data":"2026-11-05","schedinaId":"S27-D49-A","partita":"Lipsia — Manchester City","famiglia":"angoli di squadra (over)","datoDecisivo":"City 8,4 angoli a gara nelle ultime 10 trasferte contro linea 5.5","lezione":"2-3 per il City (Haaland al 78'), angoli 5-3 per il Lipsia (espn.com, gameId 401915306). Lettura del risultato giusta, mercato sbagliato: gara aperta, giocata in transizione, con il City avanti presto e ripreso due volte, e un Lipsia che in casa tiene palla (56%). Il lato debole era scritto nel motivo ('un Lipsia che in casa tiene palla toglie possesso') e l'ho ignorato, come con Celtic-Hearts. La media di 8,4 veniva da trasferte contro squadre chiuse, non contro un avversario che gioca. Calibrazione: 66 stimato, troppo alto."},{"data":"2026-11-06","schedinaId":"S27-D50-A","partita":"Sparta Praga — Bournemouth","tipo":"conferma","famiglia":"esiti (segno 2)","datoDecisivo":"Bournemouth sei vittorie di fila se const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => n == null ? '–' : n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
const segno = n => (n > 0 ? '+' : '') + eur(n);
const q2 = n => Number(n).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
const dataIt = d => { const [y,m,g] = d.split('-'); return `${g}/${m}/${y}`; };
const agente = () => (D && D.agente) || 'ANALISTA';

function badge(g){
  const c = g === 'ALTA FIDUCIA' ? 'b-alta' : g === 'INTERESSANTE' ? 'b-int' : 'b-no';
  return `<span class="badge ${c}">${esc(g)}</span>`;
}

function barcode(hex){
  let out = '';
  for (const ch of (hex || '').slice(0, 40)) {
    const v = parseInt(ch, 16);
    out += `<i style="width:${1 + (v & 3)}px;margin-right:${1 + ((v >> 2) & 1)}px"></i>`;
  }
  return `<div class="bar" aria-hidden="true">${out}</div>`;
}

function ticket(s){
  const c = s.calcolo;
  const numGiorno = s.giorno ? String(s.giorno).padStart(2, '0') : '';
  const ev = s.eventi.map((e, i) => `
    <div class="ev ${esc(e.esito)}">
      <div class="meta">${String(i + 1).padStart(2, '0')} · ${esc(e.competizione || '')}${e.ora ? ' · ' + esc(e.ora) : ''}</div><div></div>
      <div><div class="match">${esc(e.partita)}</div><div class="pick">${esc(e.scelta)}</div>${e.risultato ? `<div class="ris">Finale ${esc(e.risultato)}</div>` : ''}</div>
      <div class="q">${q2(e.quota)}</div>
    </div>`).join('');
  const chiusa = c.stato !== 'bloccata';
  return `<article class="ticket">
    <div class="t-head"><div><h3>SALA 27</h3><div class="meta">RICEVUTA ${esc(s.id.slice(-1))} · GIORNO ${numGiorno} · ${dataIt(s.data)}</div></div>
      <span class="stamp s-${c.stato}">${c.stato}</span></div>
    <div class="dash"></div>${ev}<div class="dash"></div>
    <div class="line"><span>Quota totale</span><b>${q2(c.quotaTotale)}</b></div>
    <div class="line"><span>Importo virtuale</span><b>${eur(s.importo)}</b></div>
    <div class="line ret"><span>${chiusa ? 'Ritorno' : 'Ritorno potenziale'}</span><b>${eur(chiusa ? c.ritorno : c.ritornoPotenziale)}</b></div>
    ${chiusa ? `<div class="line"><span>Risultato netto</span><b class="${c.netto >= 0 ? 'pos' : 'neg'}">${segno(c.netto)}</b></div>` : ''}
    ${s.motivazione ? `<p class="why">“${esc(s.motivazione)}”</p>` : ''}
    <div class="dash"></div>
    <div class="lock">● DECISION LOCK · <b>CHIUSO</b><br>ID <b>${esc(s.id)}</b><br>BLOCCATA ${esc(s.bloccataAlle)}<br>IMPRONTA ${esc((s.impronta || '').slice(0, 16))}</div>
    ${barcode(s.impronta)}
    <div class="foot">Ricevuta virtuale · non valida per il gioco</div>
  </article>`;
}

function mostraGiorno(data){
  const g = D.giorni.find(x => x.data === data);
  const sch = D.schedine.filter(s => s.data === data);
  $('giornoTitolo').textContent = g ? `Giorno ${g.giorno} · ${dataIt(g.data)}` : dataIt(data);
  $('commento').innerHTML = g && g.commento ? `<div class="bubble"><div class="who">${esc(agente())}</div><p>${esc(g.commento)}</p>
    <div class="stats"><span>${g.analizzate ?? (g.palinsesto || []).length} analizzate</span><span>${g.scartate ?? ''} scartate</span><span>${sch.length} ${sch.length === 1 ? 'schedina' : 'schedine'}</span></div></div>` : '';
  const pal = (g && g.palinsesto) || [];
  $('palinsesto').innerHTML = pal.length ? pal.map(p => `
    <div class="row">
      <div class="meta">${esc(p.competizione || '')}${p.ora ? ' · ' + esc(p.ora) : ''}</div>${badge(p.giudizio)}
      <div><div class="match">${esc(p.partita)}</div><div class="pick">${esc(p.lettura || '—')}${p.probStimata ? ` · stima ${esc(p.probStimata)}%` : ''}</div></div>
      <div class="q">${p.quota ? q2(p.quota) : '—'}</div>
      ${p.motivo || (p.prove && p.prove.length) || (p.fonti && p.fonti.length) ? `<details><summary>Perché</summary>${p.motivo ? `<p>${esc(p.motivo)}</p>` : ''}${p.prove && p.prove.length ? `<ol class="prove">${p.prove.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}${p.fonti && p.fonti.length ? `<p class="fonti">Fonti: ${p.fonti.map(esc).join(' · ')}</p>` : ''}</details>` : ''}
    </div>`).join('') : '<div class="empty">Nessuna analisi per questo giorno.</div>';
  $('schedineGiorno').innerHTML = sch.length ? sch.map(ticket).join('') :
    `<div class="card empty">${g ? 'Nessuna schedina: oggi niente di abbastanza solido.' : 'Ancora niente.'}</div>`;
}

function render(){
  if (!D) { $('palinsesto').innerHTML = '<div class="empty">Dati mancanti: esegui node aggiorna.js</div>'; return; }
  const R = D.riepilogo;
  $('sub').textContent = `${agente()} · match analyst`;
  $('dayN').textContent = `${Math.min(Math.max(R.giornoCorrente, 0), D.durataGiorni)}`;
  $('dayOf').textContent = `di ${D.durataGiorni}`;
  $('kSaldo').textContent = eur(R.saldo);
  $('kProf').textContent = segno(R.profitto);
  $('kProf').className = R.profitto > 0 ? 'pos' : R.profitto < 0 ? 'neg' : '';
  $('kRec').textContent = `${R.vinte} / ${R.perse}`;
  $('kDisp').textContent = eur(R.disponibile);
  $('agg').textContent = `Aggiornato ${R.aggiornato}${R.aperte ? ` · ${R.aperte} in attesa` : ''}`;

  const date = [...new Set([...D.giorni.map(g => g.data), ...D.schedine.map(s => s.data)])].sort().reverse();
  const sel = $('selGiorno');
  sel.innerHTML = date.map(d => { const g = D.giorni.find(x => x.data === d); return `<option value="${d}">${g ? 'Giorno ' + g.giorno + ' · ' : ''}${dataIt(d)}</option>`; }).join('');
  sel.hidden = date.length < 2;
  $('giornoTitolo').hidden = !sel.hidden;
  sel.onchange = () => mostraGiorno(sel.value);
  if (date.length) mostraGiorno(date[0]);
  else { $('palinsesto').innerHTML = '<div class="empty">La prima analisi arriva con l’automazione delle 11:00.</div>'; $('schedineGiorno').innerHTML = ''; }

  const tutte = [...D.schedine].sort((a, b) => (b.bloccataAlle || '').localeCompare(a.bloccataAlle || ''));
  $('tutte').innerHTML = tutte.length ? tutte.map(ticket).join('') : '<div class="card empty">Nessuna schedina ancora.</div>';

  let saldo = D.budgetIniziale;
  const righe = [...date].reverse().map(d => {
    const sch = D.schedine.filter(s => s.data === d);
    const chiuse = sch.filter(s => s.calcolo.stato !== 'bloccata');
    const netto = chiuse.reduce((t, s) => t + s.calcolo.netto, 0);
    saldo += netto;
    const g = D.giorni.find(x => x.data === d);
    const aperte = sch.length - chiuse.length;
    return `<tr><td>${g ? g.giorno : ''} · ${dataIt(d).slice(0, 5)}</td><td>${sch.length}${aperte ? ` (${aperte} in attesa)` : ''}</td>
      <td class="${netto > 0 ? 'pos' : netto < 0 ? 'neg' : ''}">${chiuse.length ? segno(Math.round(netto * 100) / 100) : '–'}</td><td>${eur(Math.round(saldo * 100) / 100)}</td></tr>`;
  });
  $('storico').innerHTML = righe.reverse().join('') || '<tr><td colspan="4" class="empty">Vuoto</td></tr>';
  $('numeri').innerHTML = `
    <div class="line"><span>Budget iniziale</span><b>${eur(D.budgetIniziale)}</b></div>
    <div class="line"><span>Totale puntato (chiuse)</span><b>${eur(R.giocato)}</b></div>
    <div class="line"><span>Resa sul puntato</span><b class="${R.resa > 0 ? 'pos' : R.resa < 0 ? 'neg' : ''}">${R.resa == null ? '–' : (R.resa > 0 ? '+' : '') + q2(R.resa) + ' %'}</b></div>
    <div class="line"><span>Rimborsate</span><b>${R.rimborsate}</b></div>
    <div class="line"><span>Perdite di fila</span><b>${R.perditeDiFila}</b></div>`;
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['oggi', 'schedine', 'storico'].forEach(t => $('t-' + t).hidden = t !== b.dataset.tab);
  scrollTo({top: document.querySelector('nav').offsetTop, behavior: 'smooth'});
});
render();
</script>
</body>
</html>
