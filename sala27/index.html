<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala 27</title>
<style>
:root{
  --bg:#e9e6dc; --paper:#fbfaf5; --ink:#1d2522; --muted:#6c746f; --line:#d9d5c7;
  --green:#123a33; --green2:#1b4d44; --gold:#e7b731; --goldsoft:#f6e3a6;
  --win:#1f7a4d; --winsoft:#dff1e6; --loss:#a8322d; --losssoft:#f6dedb; --wait:#6c746f;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{background:var(--green);color:#f3efe2;padding:18px 16px 16px;position:relative}
header .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:8px;background:var(--gold);color:var(--green);display:grid;place-items:center;font:800 17px/1 var(--mono)}
.brand h1{margin:0;font:800 22px/1.1 var(--sans);letter-spacing:.06em}
.brand small{display:block;font:600 10px/1.3 var(--mono);letter-spacing:.14em;opacity:.7;text-transform:uppercase}
.day{margin-left:auto;text-align:right;font:700 12px/1.3 var(--mono)}
.day b{display:block;font-size:22px;color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--green2);border-radius:10px;padding:10px 12px}
.kpi span{display:block;font:600 10px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.kpi b{font:800 22px/1.2 var(--sans);font-variant-numeric:tabular-nums}
.kpi b.pos{color:#8fe0b0}.kpi b.neg{color:#ff9d93}
.agg{margin-top:10px;font:500 11px/1.3 var(--mono);opacity:.6}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;padding-top:8px;padding-bottom:8px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px var(--sans)}
nav button.on{background:var(--green);color:#fff;border-color:var(--green)}
h2{font:700 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.bubble{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bubble .who{font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.bubble p{margin:0;font-size:16px}
.stats{display:flex;gap:14px;margin-top:10px;font:600 12px var(--mono);color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.meta{font:600 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.04em}
.match{font-weight:700}
.pick{font-size:14px}
.q{font:700 15px var(--mono);text-align:right;align-self:end}
.badge{justify-self:end;font:800 10px/1 var(--mono);letter-spacing:.08em;padding:5px 7px;border-radius:5px;white-space:nowrap}
.b-no{background:#e4e1d6;color:#5d625e}.b-int{background:var(--goldsoft);color:#6d5210}.b-alta{background:var(--green);color:var(--gold)}
details{grid-column:1/-1}
summary{cursor:pointer;font:600 12px var(--sans);color:var(--green2)}
details p{margin:6px 0 0;font-size:14px;color:#39423e}
.fonti{font-size:12px;color:var(--muted);word-break:break-all}
.prove{margin:6px 0 4px;padding-left:18px;font-size:13px}
.prove li{margin:2px 0}
.ticket{background:var(--paper);border-radius:4px;padding:18px 16px 14px;position:relative;margin-bottom:18px;box-shadow:0 1px 0 var(--line),0 8px 18px rgba(18,58,51,.08)}
.ticket:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px;background-repeat:repeat-x}
.t-head{display:flex;align-items:flex-start;gap:10px}
.t-head h3{margin:0;font:800 24px/1 var(--sans);letter-spacing:.04em}
.t-head .meta{margin-top:5px}
.stamp{margin-left:auto;font:800 11px/1 var(--mono);letter-spacing:.1em;padding:7px 9px;border-radius:4px;text-transform:uppercase}
.s-bloccata{background:var(--gold);color:var(--green)}.s-vinta{background:var(--green);color:#fff}.s-persa{background:var(--loss);color:#fff}.s-rimborsata{background:#d9d5c7;color:var(--ink)}
.dash{border-top:1px dashed #bdb8a8;margin:12px 0}
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0}
.ev.perso{background:var(--losssoft);margin:0 -8px;padding:8px}
.ev.vinto .q:after{content:" ✓";color:var(--win)}
.ev.perso .q:after{content:" ✕";color:var(--loss)}
.ev.annullato{opacity:.55}
.ev .ris{font:600 11px var(--mono);color:var(--muted)}
.line{display:flex;justify-content:space-between;font:600 12px/1.9 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.line b{font-size:14px}
.ret{background:var(--gold);margin:6px -8px;padding:4px 8px;border-radius:2px}
.why{font-size:14px;color:#39423e;margin:10px 0 0}
.lock{font:600 11px/1.7 var(--mono);color:var(--muted)}
.lock b{color:var(--ink)}
.bar{height:34px;margin-top:10px;display:flex;gap:0;align-items:stretch}
.bar i{display:block;background:var(--ink)}
.foot{text-align:center;font:600 9px var(--mono);letter-spacing:.12em;color:var(--muted);margin-top:6px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{font:700 10px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--win)}.neg{color:var(--loss)}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
select{font:600 13px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.bar-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.disc{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div class="logo">27</div>

</header>
<nav><div class="wrap">

    <div class="card" id="numeri"></div>

</main>

<script>
const D = {"nome":"SALA 27","agente":"VENTISETTE","dataInizio":"2026-09-17","durataGiorni":90,"budgetIniziale":100,"regole":{"importoSchedina":"Dal 17/11/2026: 10 € con fiducia piena, 5 € con fiducia ridotta; massimo 10 € al giorno.","maxSchedineGiorno":2,"eventiPerSchedina":"1 (sempre singole, mai più partite sulla stessa schedina)","quotaEvento":"1.70-2.30 (singola unica da 10 €, dal 20/10/2026 per l'obiettivo 200 €) / 1.40-2.30 (ognuna delle due singole da 5 €)","quotaTotale":"non applicabile: solo singole","metodo":"ROBETTO (SALA 30) dal 2026-09-22: favorite nette dei campionati principali italiani ed europei (Serie A, B, C inclusa), doppie, 1X2 con margine 5 punti, NO BET quando il calendario non dà margine pulito.","pausaDopoPerditeDiFila":null,"studioObbligatorio":"forma pesata, casa/trasferta separate, gol e xG fatti e subiti, frequenze contate sul mercato, assenze del giorno, calendario e turnover, movimento della quota, precedenti utili, tabellino più probabile","minSchedineGiorno":1,"notaSingole":"Dal 17/10/2026 (ordine dell'utente): mai più di una partita sulla stessa schedina. Una sola partita da giocare = singola da 10 €. Due partite = due singole da 5 €. NO BET solo se non ci sono partite giocabili.","notaMercati":"Dal 10/10/2026 (ordine dell'utente): si studiano e si giocano TUTTI i mercati, non solo 1X2, Over/Under e Gol/No Gol: calci d'angolo, cartellini, giocatori (marcatore, tiri, assist), gol di squadra, handicap, multigol, primo tempo. Ogni gara promossa deve mostrare i numeri di almeno quattro famiglie di mercato e in \"scartato\" quelli lasciati. Vince il mercato con il margine più largo, nessuno parte favorito. Resta il divieto di monocoltura: lo stesso mercato non regge tutte le gambe della giornata.","notaGambe":"Ogni gamba di ogni schedina deve essere ALTA FIDUCIA. Con le singole ammesse non esiste più la scusa della \"seconda gamba di riempimento\": se la seconda lettura non è solida, si gioca una singola.","margineMinimo":"Dal 17/11/2026: vedi fase2Stima (stima corretta -4, fiducia piena a +3 punti).","obiettivoGiornaliero":"Profitto ogni giorno: con due singole da 5 € il giorno è in attivo solo se vincono entrambe o se la quota della vinta copre la persa (quota ≥ 2,00).","scopo":"Ordine dell'utente del 10/10/2026: studiare qualunque informazione possa servire e portare a SALA 27 quanto più profitto possibile (arbitro, meteo e campo, motivazioni, fatica e viaggi, formazioni ufficiali, stile di gioco, movimento delle quote, modelli, numeri individuali), non solo le voci in elenco. Ogni schedina chiusa si etichetta con famiglia di mercato e dato decisivo; alla taratura si conta cosa paga e si sposta lo studio lì. Nei messaggi niente prediche sul fatto che il profitto sicuro non esiste: l'utente lo sa.","obiettivo":"Ordine dell'utente del 16/11/2026: chiudere il giorno 90 (15/12/2026) sopra i 100 € iniziali. Si parte da 72,09 €.","mercatiVietati":"Ordine dell'utente del 24/10/2026: VIETATI Gol, No Gol e ogni combo che li contiene (vince a zero, 1 + Gol, 1 + No Gol, Gol + Over, ecc.). Restano vietati Under 2.5 e Under 3.5 (ordine del 20/10/2026). Mai lo stesso mercato due giorni di fila. Mercati gol totali solo se nessun esito, handicap, team total, angoli, cartellini o giocatore ha margine.","handicapAsiatico":"Dal 01/11/2026 (ordine dell'utente): solo in casi eccezionali, al massimo uno ogni 5 giorni e solo a linea intera (-1, -2, +1...); vietati quarti di gol e mezze linee.","combo":"Dal 02/11/2026 (ordine dell'utente): vietate le combo di ogni tipo (1 + Over, 1 + Gol, multigol con segno, parziale/finale...). Un solo esito semplice per partita: segno 1X2, doppia chance (1X, X2, 12), DNB, team total, angoli, cartellini o giocatore, sempre senza condizioni aggiunte.","quotaSingola":"1,50-2,30 per la singola da 10 €; 1,40-2,30 per le singole da 5 €.","ordine09nov":"Ordine dell'utente del 09/11/2026 (prevale su tutto): almeno una schedina ogni giorno, NO BET per prudenza vietato. Palinsesto mondiale e multisport (calcio, tennis, basket, hockey, NFL, pallavolo, rugby, ecc.). Prima si cerca una giocata con stima >= 100/quota + 5 punti e dati verificati per la data; se non c'è nel calcio si allarga agli altri sport e continenti; solo dopo il giro completo si gioca quella col margine più alto. Dati non verificati o lato debole contro la giocata non possono essere la giocata del giorno se esiste un'alternativa verificata. Combo vietate in tutti gli sport.","fasciaBassa":"Dal 04/11/2026 (ordine dell'utente, prova): ammesse singole da 5 € a quota 1,30-1,50, solo come una delle due schedine da 5 € del giorno e solo se probStimata supera 100/quota di almeno 8 punti (1,30 → 85%, 1,40 → 80%, 1,50 → 75%). La singola unica da 10 € resta a 1,50-2,30. Verifica dopo 10 schedine della fascia: vinte, perse e saldo della fascia.","soloCalcio":"Ordine dell'utente del 15/11/2026 (prevale su ordine09nov): SOLO CALCIO. Vietati basket, tennis, hockey, NFL, rugby e ogni altro sport, nelle schedine e nel palinsesto. Resta almeno una schedina al giorno scelta tra tutte le competizioni di calcio del mondo, con la selezione in due passi (+5 punti, poi margine piu alto).","fase2":"Ordine dell'utente del 16/11/2026: altri 30 giorni (17/11-15/12/2026, giorni 62-90) per chiudere in attivo, ripartendo dal saldo di 72,09 €. Regole qui sotto (fase2*) prevalgono su tutte le precedenti.","fase2Mercati":"Solo esiti semplici: segno 1X2, doppia chance, DNB, handicap a linea intera. Vietati Over/Under, team total, Gol/No Gol, multigol, angoli, cartellini, giocatori, multiple e combo. Numeri dei 60 giorni: segno 12V 4P +29,95 €, handicap 4V 2P +11,60, doppia chance 1V 0P +7,90; gol totali/squadra 7V 9P -42,00, multiple e combo 1V 8P -34,86.","correzioneStima":6,"marginePieno":3,"fase2Stima":"probStimata si scrive grezza; dal 25/11/2026 la stima corretta e probStimata - 6 (prima -4). Fiducia piena solo se stima corretta >= 100/quota + 3 punti.","fase2Puntata":"Almeno una schedina al giorno, massimo 10 € al giorno, solo singole. fiducia \"piena\" = singola da 10 € (o due singole piene da 5 €). Se nessuna gara arriva alla fiducia piena si gioca la lettura migliore con fiducia \"ridotta\" da 5 €. aggiorna.js blocca le schedine che violano queste regole.","fase2Clv":"Per ogni evento, alla chiusura del giorno dopo, si annota quotaChiusura (ultima quota prima del via, oddsportal/flashscore). Se in 10 giorni la quota di chiusura e piu alta di quella giocata in oltre meta dei casi, il mercato va contro: si alza marginePieno.","fase2Campionati":"Solo calcio, priorita a campionati principali, seconde divisioni e coppe europee (terreno del periodo 1-15/10: 12V 3P, +53,80 €). Extra-Europa solo con dati e quote verificati."},"evoluzione":[{"data":"2026-09-22","giorno":6,"cosa":"Ordine dell'utente (invariante, non evoluzione autonoma): copiare ROBETTO di SALA 30 in tutto. Importo da 5 a 10 € per schedina; via l'obbligo di almeno una schedina al giorno, NO BET di nuovo legittimo; doppie da 2 eventi come struttura normale; quota singola 1,25-2,10 e totale 1,80-3,50; il segno 1X2 sulle favorite nette dei campionati principali torna di prima scelta con margine 5 punti (non più 8); copertura prioritaria Italia (A, B, C) ed Europa, extra-europei facoltativi.","perche":"Video del 22/09 (realmarcoai): Robetto è a 152,06 € dopo due ricevute vinte (+33,72 € netti) con City, Milan, Liverpool e Juventus, tutte favorite 1X2 dei campionati maggiori. Alla domanda 'domani e dopodomani cosa giochiamo?' risponde 'Niente. NO BET... il calendario delle prossime 48 ore non mi dà un margine abbastanza pulito: non invento una giocata per riempire uno spazio'. SALA 27 oggi ha fatto la stessa scelta sulla sosta per le nazionali.","daiNumeri":"SALA 27 dopo 6 giorni: 82,99 €, schedine 2 vinte e 6 perse; eventi 7 vinti e 7 persi. 1X2 3 su 7, mercati gol 4 su 7. SALA 30: 152,06 €. Nota onesta: il campione di Robetto visto finora è di poche ricevute, la differenza vera è la selezione delle favorite nei campionati principali."},{"data":"2026-09-19","giorno":3,"cosa":"Verifica sul campo della regola adottata poche ore prima: il DEFAULT SUI MERCATI DEI GOL resta e si rafforza. In aggiunta: (1) le prove contate 'per negazione' (una squadra che non ha mai segnato/vinto/subito) valgono metà di quelle 'per affermazione', perché basta un episodio a smentirle e non si può contare su una cosa che non è mai successa; (2) quando entrambe le squadre hanno assenze, si pesa DOVE sono (reparto) e non quante sono.","perche":"Le due schedine del giorno 3 sono state perse entrambe, e tutti e quattro gli eventi erano segni 1X2. Sulle stesse identiche partite un mercato sui gol avrebbe incassato in 3 casi su 4: Brighton-Arsenal 3-0 (Over 2.5 ok), Kilmarnock-Hearts 1-1 (Gol/Gol ok, e il pareggio all'86' ha ucciso il segno 2), Charleroi-Cercle 3-2 (Over 2.5 e Gol/Gol entrambi ok). Solo Forest-Coventry 0-1 non dava gol. Il segno 1X2 ha perso su tutte e tre le modalità possibili: ribaltone pieno (Arsenal), sconfitta a sorpresa con gol annullato al VAR (Forest), pareggio in extremis (Hearts).","daiNumeri":"Giorno 3: 4 eventi 1X2, 1 vinto e 3 persi (25%). Eventi sui gol chiusi nei giorni 1-2: 2 vinti su 3 (67%). Totale eventi ALTA FIDUCIA chiusi: 4 su 8 (50%), in calo dal 75% dei primi due giorni. Schedine: 1 vinta su 5. Saldo virtuale sceso da 100,14 € a 90,14 €."},{"data":"2026-09-19","giorno":3,"cosa":"Studiati tre reel di ROBETTO/SALA 30 (19/09/2026) fotogramma per fotogramma. Recepite due regole: (1) DEFAULT SUI MERCATI DEI GOL — non si sceglie il vincitore se esiste una lettura sui gol; un 1X2 richiede ora margine di 8 punti invece di 5, perché perde sia sul pareggio sia sul ribaltone; (2) POCHE PARTITE STUDIATE A FONDO — il palinsesto scende da 15-25 (oggi 41) a 10-14 gare con studio obbligatorio completo. Aggiunto anche l'obbligo di registrare il mercato scartato sulla stessa partita (campo 'scartato').","perche":"Nella schermata di SALA 30 la lettura di ROBETTO è motivata così: 'isola il percorso comune verso il gol senza scegliere un vincitore'. Sulla stessa gara (Monza-Sassuolo) ha scartato Over 2.5 a 1,75 e giocato Entrambe segnano a 1,69, citando prove contate identiche alle mie ('entrambe a segno in quattro su quattro'). La loro pagina dichiara '10 EVENTI · 2 PROMOSSI': studiano dieci gare, non quaranta. Il 19/09 SALA 27 ne ha analizzate 41 e ha prodotto quattro gambe tutte di tipo 1X2, cioè il mercato a varianza più alta: è questa la differenza strutturale, non la quantità di partite.","daiNumeri":"Oggi 4 eventi su 4 erano segni 1X2 (Arsenal 1,76, Forest 1,62, Charleroi 1,73, Hearts 1,65): zero mercati sui gol. Nei primi 2 giorni invece i 3 eventi sui gol chiusi (Celtic Over 2.5, Monza Over 2.5 vinti; Palace Gol/Gol perso) avevano reso 2 su 3, mentre l'unico evento perso per ribaltone era un 1X2 (Espanyol). SALA 30, per confronto, al giorno 5 era a 99,64 € (sotto il capitale iniziale) dopo aver perso una schedina da 10 €: SALA 27 è a 100,14 €."},{"data":"2026-09-19","giorno":3,"cosa":"Ulteriore allargamento su richiesta dell'utente (che ha indicato eurosport.it/calcio/eventlist.shtml come riferimento): aggiunti alla copertura Scottish Premiership, Jupiler Pro League (Belgio), Super League svizzera, Bundesliga austriaca, Super League greca, Ekstraklasa (Polonia), Eliteserien, Allsvenskan, Saudi Pro League, più le coppe continentali extra-UE (Libertadores, Sudamericana, CONCACAF Champions Cup, AFC Champions League, CAF Champions League) da verificare caso per caso.","perche":"L'utente vuole il set di competizioni più ampio possibile per aumentare le occasioni di trovare mismatch veri. L'indice di eurosport.it è soprattutto un menu di coppe internazionali e nazionali maggiori, non un database di tutti i campionati minori del mondo: l'elenco aggiunto viene da ricerca diretta sulle partite in programma oggi, non dal semplice indice.","daiNumeri":"—"},{"data":"2026-09-19","giorno":3,"cosa":"Su richiesta esplicita dell'utente in chat: allargata la ricerca anche a campionati minori extra-europei (Brasile, Argentina, MLS, Liga MX, J1, K League, A-League) oltre alle leghe europee minori già coperte. Il criterio di scelta privilegia ora esplicitamente il distacco di livello netto tra le due squadre (capolista-ultima, big-neopromossa in crisi) rispetto ai big match equilibrati, perché sono letture statisticamente più sicure.","perche":"L'utente chiede più occasioni per 'partite facili' invece che gare spettacolo, con l'obiettivo di fare cassa ogni giorno. Ho ampliato lo spettro di ricerca (più probabilità di trovare due ALTA FIDUCIA reali) ma NON ho introdotto una regola di profitto garantito: nessuna lettura statistica può assicurarlo, e forzare un giudizio per arrivare a un numero è esattamente l'errore già registrato il giorno 2 (Espanyol-Elche).","daiNumeri":"—"},{"data":"2026-09-18","giorno":2,"cosa":"Nuove regole di metodo: scelta del mercato che sopravvive a più scenari (con divieto di Gol/Gol quando il favorito fa clean sheet in metà delle ultime 6 o l'ospite segna in meno del 60% delle gare esterne), prove contate obbligatorie per un ALTA FIDUCIA, test del risultato più probabile prima del blocco. Quota singola da 1,30-1,95 a 1,25-1,95, quota totale da 2,00-3,50 a 1,90-3,00.","perche":"Confronto diretto su Crystal Palace — Lech Poznan: lettura giusta, mercato sbagliato. Gol/Gol a 1,88 morto sul 4-0, Over 2.5 sulla stessa gara vinto. I range vecchi spingevano verso quote alte, cioè verso il rischio, contro l'obiettivo dichiarato di vincere poco ma sicuro.","daiNumeri":"1 schedina vinta e 1 persa su 2; l'unico evento perso su 4 era l'unico Gol/Gol giocato"},{"data":"2026-09-18","giorno":2,"cosa":"Attivata l'evoluzione autonoma: dopo ogni schedina chiusa rivedo lettura, mercato e calibrazione, aggiorno lezioni e conferme e cambio le regole da solo, registrando tutto qui. Taratura delle stime ogni 5 giorni.","perche":"Delega esplicita dell'utente: imparare ed evolvere senza chiedere autorizzazioni. Restano fissi solo gli invarianti (niente soldi veri, 5 € per schedina, massimo 2 al giorno, 30 giorni, schedine bloccate intoccabili, niente dati inventati, pausa dopo 3 perdite di fila).","daiNumeri":"—"},{"data":"2026-09-18","giorno":2,"cosa":"Una schedina nasce solo se il giorno produce almeno DUE eventi ALTA FIDUCIA. L'INTERESSANTE è ammesso solo come evento aggiuntivo sopra quei due, mai come il secondo evento che rende possibile la schedina. Con una sola ALTA FIDUCIA: zero schedine. E se per rispettare il range di quota totale devo cambiare partita, non gioco: il vincolo non sceglie mai la giocata.","perche":"La schedina di oggi esisteva solo perché serviva un secondo evento: l'unica ALTA FIDUCIA del giorno (Monza Over 2.5) ha vinto, l'INTERESSANTE aggiunto per forza (Espanyol) ha perso e si è portato via la schedina. Bristol City era stato scartato perché 1,81 x 1,95 sforava il tetto di 3,50: è stato il tetto a scegliere la partita, non l'analisi.","daiNumeri":"Eventi chiusi: ALTA FIDUCIA 3 su 4 vinti (75%), INTERESSANTE 1 su 2 (50%). Schedine: 1 vinta su 3. Le due schedine perse contenevano entrambe l'unico evento debole della giornata."},{"data":"2026-09-18","giorno":2,"cosa":"Su indicazione dell'utente: abolita la pausa dopo 3 perdite di fila, si gioca tutti i giorni. In cambio lo studio diventa obbligatorio e più profondo (9 voci: forma pesata sul livello degli avversari, casa/trasferta separate, gol e xG fatti e subiti, frequenze contate sul mercato scelto, assenze verificate in giornata, calendario e turnover, movimento della quota di apertura, precedenti utili, tabellino più probabile) e il palinsesto passa da 10-20 a 15-25 partite, valutando più mercati sulla stessa gara. Se mancano due ALTA FIDUCIA si allarga la ricerca invece di rinunciare.","perche":"L'utente vuole che si continui a giocare fino a imparare a vincere, e che la schedina si possa costruire su qualsiasi evento purché studiato davvero. Fermarsi non insegna niente: quello che mancava alle due schedine perse non era la prudenza, era la profondità dell'analisi.","daiNumeri":"Le perdite di fila salgono a 2 e con la vecchia regola domani si sarebbe rischiato lo stop dopo un'altra sconfitta; il capitale disponibile è 100,14 €, cioè 20 schedine di margine"},{"data":"2026-09-20","giorno":4,"cosa":"Ammessa la schedina a evento singolo (da 2-3 eventi a 1-3), quota totale minima portata da 1,90 a 1,45, introdotto l’obbligo di almeno una schedina al giorno e allargata la copertura obbligatoria ai campionati extra-europei (Liga MX, MLS, Brasileirão) già da oggi.","perche":"Richiesta esplicita dell’utente (invariante, non evoluzione autonoma): si gioca tutti i giorni, anche con una squadra sola per schedina. I numeri la sostengono: nelle 5 schedine bloccate finora, 10 eventi, 4 vinti e 6 persi, ma nessuna schedina è stata persa per colpa della gamba più forte. Su S27-D02-A e S27-D03-B la gamba forte ha vinto (Monza Over 2.5, Charleroi) ed è stata la seconda gamba a distruggere il biglietto (Espanyol, Kilmarnock-Hearts). Imporre due gambe quando la giornata ne offre una sola è stato finora il difetto più costoso del metodo.","daiNumeri":"10 eventi bloccati: 4 vinti, 6 persi. 3 schedine su 5 perse per la seconda gamba, 0 per la prima. Con le singole, oggi il biglietto è un Toluca Over 2.5 a 1,57 stimato 73%, invece di un 2,48 appeso a un evento che ho declassato io stesso."},{"data":"2026-09-20","giorno":4,"cosa":"Quota minima per singolo evento abbassata da 1,25 a 1,20 (solo per mercati che non sono 1X2 e con probabilità stimata almeno 85%). Introdotto il divieto di monocoltura di mercato: lo stesso mercato non può reggere tutte le gambe della giornata, e per ogni partita promossa vanno valutate almeno due famiglie di mercato. Introdotta la regola che ogni gamba deve essere ALTA FIDUCIA, senza eccezioni.","perche":"Contestazione diretta dell’utente: \"sei troppo ripetitivo, over 2.5\". Aveva ragione e i numeri lo dicono: nei primi 4 giorni ho promosso 10 eventi e 6 erano Over 2.5 o Gol/Gol, cioè lo stesso ragionamento riciclato. Applicando il vincolo oggi, sul Milan-Lecce ho ribaltato la mia scheda: l’Over 2.5 a 1,57 poggiava su un Milan che in casa segna 1,30 gol a gara e supera la linea 4 volte su 10, mentre il No Gol a 1,68 poggia su 6 No Gol su 10 in casa e sul Lecce a secco in 6 trasferte su 10. Stesso studio, mercato opposto, 6,5 punti di margine invece di 2.","daiNumeri":"Primi 4 giorni: 10 eventi promossi, 6 sullo stesso schema Over/Gol-Gol, 4 vinti e 6 persi. Oggi 23 partite analizzate, 3 promosse su 3 mercati diversi (Over 2.5, gol di squadra, No Gol) e 2 schedine bloccate per 10 € impegnati, la prima volta che si raggiunge il massimo giornaliero."},{"data":"2026-09-20","giorno":4,"cosa":"Nuovo vincolo sullo studio obbligatorio, voce \"frequenze contate\": la frequenza va contata su ENTRAMBE le squadre sulla riga esatta del mercato, e quando la media gol di una squadra è distorta da una goleada isolata si usa la mediana. Per i team total serve in più la frequenza con cui l’AVVERSARIO ha subito almeno quel numero di gol.","perche":"Errore di oggi su AZ-Telstar: avevo l’87% di probabilità stimata contro l’82% della quota, ma quel 87% veniva da un dato solo (AZ 2+ gol in 12 delle ultime 13 interne). Sul Telstar avevo usato la media di 1,83 gol subiti, gonfiata dallo 0-4 con l’Ajax: contando davvero, il Telstar aveva subito 2 o più gol in 3 partite su 6, cioè il 50%. Con il dato giusto la stima corretta era intorno al 70%, sotto l’82% della quota, e la lettura era NO BET, non ALTA FIDUCIA. Finita 1-0.","daiNumeri":"Giorno 4: 3 eventi bloccati, 1 vinto (Milan No Gol 3-0), 1 perso (AZ 1-0), 1 ancora aperto (Toluca, 02:00). Bilancio complessivo 5 vinti e 7 persi su 12 eventi. Le letture su mercati \"gol di squadra\" sono 0 su 1: la prima volta che ho usato quel mercato ho sbagliato proprio il lato della frequenza che non avevo contato."},{"data":"2026-09-21","giorno":5,"cosa":"Nessuna modifica alle regole.","perche":"Campione troppo piccolo per tarare: dopo la chiusura di Toluca gli eventi chiusi sono 13, con 6 vinti e 7 persi; la singola ALTA FIDUCIA su mercato gol ha vinto. Un solo dato in più non giustifica di spostare soglie.","daiNumeri":"13 eventi chiusi, 6 vinti, 7 persi. Mercati sui gol: 4 vinti su 6. Toluca: stimato 73%, uscito."},{"data":"2026-09-23","giorno":7,"cosa":"Nessuna modifica alle regole.","perche":"Nessuna schedina chiusa dall'ultima revisione (la S27-D05-A era già stata valutata il 22/09) e oggi niente da giocare: nessun numero nuovo su cui ragionare.","daiNumeri":"2 vinte / 6 perse su 8 chiuse, saldo 82,99 €: invariato."},{"data":"2026-09-24","giorno":8,"cosa":"Nessuna modifica alle regole.","perche":"Nessuna schedina chiusa da ieri (0 aperte). Taratura rimandata: campione troppo piccolo per spostare soglie.","daiNumeri":"vinte 2 / perse 6 schedine; nessun nuovo esito"},{"data":"2026-09-25","giorno":9,"cosa":"Tolto il veto di fatto sulle nazionali. Una gara di nazionali si studia come un club, con tre adattamenti: (1) le frequenze si contano sulle ultime 10 gare ufficiali e amichevoli, dando più peso a quelle ufficiali; (2) casa e campo neutro si tengono separati, perché al Mondiale non si gioca in casa; (3) le assenze si leggono dalla lista dei convocati, pesando il reparto. Per una singola il minimo di quota totale 1,80 non si applica: vale il range di quota singola 1,25-2,10.","perche":"Contestazione dell'utente del 25/09: 'stai solo avendo paura di giocare e sbagliare, chi ti dice che non puoi prendere dati sulle nazionali?'. Aveva ragione. Il 24/09 e stamattina ho scartato le nazionali con la frase 'mancano frequenze contate', senza cercarle. Cercate davvero, c'erano: ESPN ha i risultati gara per gara, i comparatori le quote dei mercati gol, le anteprime le assenze.","daiNumeri":"Rifatto lo studio su 9 gare: 1 ALTA FIDUCIA (Svezia-Romania Gol/Gol, stima 66% contro 58,5%), 1 INTERESSANTE, 7 NO BET. Prima di cercare: 0 ALTA FIDUCIA su 7 guardate. Schedine chiuse finora: 2 vinte e 6 perse, saldo 82,99 €."},{"data":"2026-09-26","giorno":10,"cosa":"Taratura del giorno 10: nessuna modifica alle regole.","perche":"Campione ancora piccolo. Eventi chiusi 15, vinti 8 (53%), contro una stima media intorno al 65-70%: sto stimando alto, ma quasi tutte le perdite sono del periodo pre-Robetto (giorni 1-5). Dal metodo Robetto una sola schedina chiusa, vinta (Svezia-Romania). Tengo il margine a 5 punti e oggi pretendo di fatto 10 sull'unica giocata.","daiNumeri":"Schedine chiuse 9: 3 vinte, 6 perse. Eventi 8/15."},{"data":"2026-09-27","giorno":11,"cosa":"Vietato l'Under 2.5 quando la favorita di casa è una capolista con percorso netto (5+ vittorie di fila): si gioca il segno o niente.","perche":"S27-D10-A persa 3-0 su Cittadella 7 su 7: la lettura sulla superiorità era giusta, il mercato chiedeva il contrario di ciò che la superiorità produce.","daiNumeri":"Cittadella 7 vittorie su 7; Under 2.5 perso con 3 gol in 30 minuti del secondo tempo."},{"data":"2026-09-28","giorno":12,"cosa":"Nessuna modifica alle regole.","perche":"Dal metodo Robetto (22/09) le schedine chiuse sono 3: vinte Svezia-Romania e Curaçao-Nicaragua, persa Cittadella-Lecco sul mercato (già corretto con il divieto dell'Under contro la capolista). Le due vinte erano segno o gol su prove contate per affermazione: il metodo regge, non si tocca per un campione di tre.","daiNumeri":"Schedine chiuse 11: 4 vinte, 7 perse. Metodo Robetto 2 su 3. Oggi NO BET su 10 gare studiate."},{"data":"2026-09-30","giorno":14,"cosa":"Nessuna modifica alle regole. Aggiunta una verifica: la quota va letta su una pagina che riporti data e partita esatte (oggi la sola quota Over trovata per Benfica-Bayern era della gara maschile del 2025).","perche":"Nessuna schedina chiusa dall'ultima revisione (0 aperte, 29/09 senza voce). La taratura resta quella del giorno 12: metodo Robetto 2 vinte su 3.","daiNumeri":"Schedine chiuse 11: 4 vinte, 7 perse. Saldo 83,89 €. Oggi NO BET su 8 gare studiate."},{"data":"2026-10-01","giorno":15,"cosa":"Nessuna modifica alle regole. Aggiunta una verifica: le frequenze dichiarate dai siti di pronostici si ricontano sui risultati gara per gara (oggi il 'Kosovo Over in 7 delle ultime 10' era in realtà 4 su 10 su ESPN) e si controlla che la gara non sia già stata giocata per fuso orario (Argentina-Bolivia).","perche":"Nessuna schedina chiusa dall'ultima revisione (0 aperte). Taratura invariata: metodo Robetto 2 vinte su 3.","daiNumeri":"Schedine chiuse 11: 4 vinte, 7 perse. Saldo 83,89 €. Oggi 10 gare studiate, 1 ALTA FIDUCIA, 1 INTERESSANTE."},{"data":"2026-10-02","giorno":16,"cosa":"Taratura del giorno 16: nessuna modifica alle regole.","perche":"Dal metodo Robetto (22/09) le schedine chiuse sono 4: vinte Svezia-Romania (Gol/Gol), Curaçao-Nicaragua (1), Azerbaigian-Liechtenstein (No Gol); persa Cittadella-Lecco (Under, mercato già vietato contro la capolista). Le tre vinte poggiavano su prove per affermazione e su margini da 7 punti in su: il metodo regge, non si tocca. Oggi il migliore (Ucraina-Irlanda del Nord) ha 4,6 punti: resta fuori, la soglia di 5 non si lima.","daiNumeri":"Schedine chiuse 12: 5 vinte, 7 perse. Metodo Robetto 3 su 4 (stime 66, 79, 82, 69: media 74%, uscite 75%: calibrato). Oggi 11 gare studiate, 0 ALTA FIDUCIA, 1 INTERESSANTE."},{"data":"2026-10-03","giorno":17,"cosa":"Nessuna modifica alle regole.","perche":"Nessuna schedina chiusa dall'ultima revisione (0 aperte, ieri NO BET). Taratura invariata dal giorno 16: metodo Robetto 3 vinte su 4, stime medie 74% contro 75% uscite.","daiNumeri":"Schedine chiuse 12: 5 vinte, 7 perse. Saldo 88,09 €. Oggi 12 gare studiate, 1 ALTA FIDUCIA."},{"data":"2026-10-04","giorno":18,"cosa":"Nuova condizione per il No Gol: l'avversario della favorita deve essere rimasto a secco in almeno metà delle sue ultime gare nella stessa condizione (trasferta o casa), contate gara per gara. Le porte inviolate della favorita da sole non bastano più. Taratura: margine richiesto invariato a 5 punti.","perche":"No Gol giocati finora: vinti Milan-Lecce (Lecce a secco in 6 trasferte su 10) e Azerbaigian-Liechtenstein (Liechtenstein a secco in 7 trasferte su 8); persi Lanús-Estudiantes e Cittadella-AlbinoLeffe, dove l'avversario segnava con regolarità (AlbinoLeffe a secco 2 volte su 7). Le due vinte avevano la prova sul lato dell'avversario, le due perse no.","daiNumeri":"Schedine chiuse 13: 5 vinte, 8 perse. Metodo Robetto 3 su 5: stime 66, 79, 82, 69, 64 (media 72%) contro 60% uscite. Sto stimando alto di circa 12 punti su un campione di cinque: non sposto ancora la soglia, ma la nuova condizione taglia esattamente le due letture sbagliate di tipo No Gol/Under."},{"data":"2026-10-05","giorno":19,"cosa":"Nessuna modifica alle regole.","perche":"La condizione sul No Gol introdotta ieri ha superato la prima prova (Malta-Andorra 1-0) e oggi ha bocciato due No Gol che prima sarebbero passati per buoni (Irlanda del Nord-Georgia: Georgia a secco solo 6 volte in 20 trasferte; Cipro-Lettonia: Lettonia a secco 9 su 20). La soglia dei 5 punti resta: oggi il migliore, Romania-Svezia Gol/Gol, si ferma a 4,3.","daiNumeri":"Schedine chiuse 14: 6 vinte, 8 perse. Metodo Robetto 4 su 6: stime 66, 79, 82, 69, 64, 74 (media 72%) contro 67% uscite. No Gol con prova sull'avversario 3 su 3, senza 0 su 2."},{"data":"2026-10-05","giorno":19,"cosa":"Ordine dell'utente (invariante): almeno una schedina al giorno, tutti i giorni. Obiettivo +5 € a giornata: quota totale minima 1,50 (10 € a 1,50 = 15 €). Il margine richiesto scende da 5 punti a 0: si gioca la lettura migliore del giorno se la stima è almeno pari alla quota. NO BET solo a calendario vuoto.","perche":"Contestazione dell'utente: 'sti range di quota e i 5 punti di margine sembrano solo scuse per rischiare il meno possibile; ogni giorno devi studiare partite e minimo voglio un guadagno di 5 euro'. Il range 1,25-2,10 veniva dall'ordine 'copia Robetto' del 22/09; i 5 punti di margine li avevo fissati io il 18/09.","daiNumeri":"Dal 22/09 a oggi 7 NO BET su 14 giorni. Schedine chiuse 14: 6 vinte, 8 perse; metodo Robetto 4 su 6. Le giocate con margine fra 0 e 5 punti non sono mai state provate: da oggi si misurano."},{"data":"2026-10-06","giorno":20,"cosa":"Gol/Gol: la condizione del No Gol diventa simmetrica. Si gioca solo se la squadra che segna meno è andata a segno in almeno 7 delle sue ultime 10 gare nella stessa condizione (casa o trasferta), contate gara per gara. Il 60% non basta più. Margine minimo resta 0 (ordine dell'utente).","perche":"Romania-Svezia perso 0-1: prova solo sulla difesa svedese, attacco rumeno al 60%. È lo stesso schema che ha fatto perdere il No Gol di Cittadella (prova su un lato solo); la condizione sull'avversario introdotta il 04/10 è a 4 su 4 contando oggi Malta-Andorra.","daiNumeri":"Schedine chiuse 15: 6 vinte, 9 perse. Metodo Robetto 4 su 7: stime 66, 79, 82, 69, 64, 74, 68 (media 72%) contro 57% uscite. Giocate con margine sotto i 5 punti: 0 su 1. Mercati gol con prova contata su entrambi i lati: 3 su 3; con prova su un lato solo: 0 su 3."},{"data":"2026-10-07","giorno":21,"cosa":"Nessuna modifica alle regole. Taratura: stime ancora alte rispetto agli esiti, ma il margine minimo resta 0 per ordine dell'utente; la correzione passa dalle prove contate su entrambi i lati, che stanno funzionando.","perche":"La condizione sull'avversario per No Gol e Gol/Gol ha fatto un altro centro (Svizzera-Macedonia 3-0). Oggi in Europa non si gioca niente di verificabile oltre alla Coppa Italia Serie D: la giocata viene dal Brasileirão, come il Toluca-Santos del 20/09.","daiNumeri":"Schedine chiuse 16: 7 vinte, 9 perse. Metodo Robetto 5 su 8: stime 66, 79, 82, 69, 64, 74, 68, 72 (media 71,8%) contro 62,5% uscite. Mercati gol con prova contata su entrambi i lati: 4 su 4; con prova su un lato solo: 0 su 3. Giocate con margine sotto i 5 punti: 0 su 1, oggi la seconda prova (Cruzeiro, margine 3,4)."},{"data":"2026-10-08","giorno":22,"cosa":"Nessuna modifica alle regole. Nota di metodo: con il palinsesto europeo vuoto si resta nel Brasileirão, e si preferisce il mercato con il margine più largo tra quelli che passano la soglia, non il segno per abitudine.","perche":"Cruzeiro-São Paulo vinto con margine 3,4: le giocate sotto i 5 punti di margine ora sono 1 su 2, campione troppo piccolo per toccare il margine (che comunque resta 0 per ordine dell'utente). Il segno secco Robetto continua a reggere sulle favorite in casa con avversario che non segna fuori.","daiNumeri":"Schedine chiuse 17: 8 vinte, 9 perse. Metodo Robetto 6 su 9 (stime medie 70,4% contro 66,7% uscite). Segno secco su favorita: 2 su 2 (Curaçao, Cruzeiro). Mercati gol con prova contata su entrambi i lati: 4 su 4."},{"data":"2026-10-09","giorno":23,"cosa":"Nessuna modifica alle regole. Nota di metodo: una quota trovata solo su un book americano (BetUS, BetMGM) non vale come verificata per un ALTA FIDUCIA; serve almeno un comparatore europeo o due fonti concordi.","perche":"Fluminense-Coritiba vinto con prova contata su entrambi i lati: il criterio regge, non si tocca. Oggi Dortmund-Werder aveva l'1 solo a 4/11 da BetUS e l'Over solo a -250 da BetMGM: prezzi non confrontabili, giudizio abbassato a INTERESSANTE.","daiNumeri":"Schedine chiuse 18: 9 vinte, 9 perse. Metodo Robetto 7 su 10 (stime medie 69% contro 70% uscite: calibrato). Mercati gol con prova contata su entrambi i lati: 5 su 5. Giocate con margine sotto i 5 punti: 2 su 3. Cinque vinte nelle ultime sei."},{"data":"2026-10-10","giorno":24,"cosa":"Nuova condizione per l'Over 2.5, simmetrica a Gol/Gol e No Gol: la squadra meno prolifica deve avere l'Over 2.5 in almeno metà delle sue ultime gare nella stessa condizione (casa o trasferta), contate gara per gara. Se non ce l'ha, l'Over si scarta e si guarda al mercato che sfrutta proprio quel difetto (No Gol, gol di squadra della favorita).","perche":"West Ham-QPR perso 1-1: il West Ham aveva l'Over in 10 su 11, il QPR fuori solo in 2 su 5. La prova contata c'era su un lato solo, e l'altro lato l'avevo persino annotato come debole. Le due giocate gol vinte prima (Fluminense, Cruzeiro) avevano la prova su entrambi i lati.","daiNumeri":"Schedine chiuse 19: 9 vinte, 10 perse. Metodo Robetto 7 su 11. Mercati gol con prova contata su entrambi i lati: 5 su 5; con prova su un lato solo: 0 su 1 da quando la conto. Giocate con margine sotto i 5 punti: 2 su 4."},{"data":"2026-10-10","giorno":24,"cosa":"Ordine dell'utente: aperti tutti i mercati. Calci d'angolo, cartellini, giocatori (marcatore, tiri, assist), falli e gli altri entrano nello studio obbligatorio accanto a esiti e gol. Per ogni gara promossa vanno contati i numeri di almeno quattro famiglie; cartellini solo con arbitro verificato, giocatori solo con titolarità verificata il giorno stesso.","perche":"Contestazione dell'utente dopo la giornata 24: 'ti limiti a 1X2, Over/Under e Gol/No Gol, così rimani limitato'. Ha ragione: oggi su dieci gare ho guardato solo esiti e gol, e ho lasciato sul tavolo quote già trovate su marcatori e gol di squadra senza studiarle.","daiNumeri":"Su 20 schedine bloccate, tutte le gambe sono su esiti o gol: zero su angoli, cartellini o giocatori. Bilancio 9 vinte e 10 perse: con un solo tipo di mercato il margine medio delle ultime quattro giocate è sotto i 5 punti."},{"data":"2026-10-10","giorno":24,"cosa":"Ordine dell'utente: lo scopo dell'agente è studiare qualunque informazione utile al profitto della schedina. Le liste dello studio obbligatorio diventano il minimo, non il limite. Da oggi ogni lezione porta la famiglia di mercato giocata e il dato che ha deciso la lettura, e la taratura dei 5 giorni conta vinte e perse per famiglia e per tipo di dato.","perche":"Parole dell'utente: 'devi imparare a studiare qualsiasi cosa che può essere utile al fine di portare un profitto sicuro, è questo il senso per cui ti ho creato'. Finora lo studio seguiva nove voci fisse e tre mercati.","daiNumeri":"21 schedine bloccate: 20 su esiti o gol, 1 sugli angoli (aperta). 9 vinte e 10 perse: con lo studio di prima il saldo è 86,09 € su 100."},{"data":"2026-10-11","giorno":25,"cosa":"Taratura del giorno 25, nessuna regola cambiata. Nota di metodo per gli angoli: la somma degli angoli battuti non basta, dal prossimo Over angoli servono anche gli angoli concessi dalle due squadre o almeno la ripartizione attesa tra casa e ospite; senza, il giudizio massimo è INTERESSANTE.","perche":"Due vinte su due ieri: No Gol col Getafe (prova sull'attacco dell'avversario, quinta su cinque) e primo Over angoli (12 contro linea 9,5). Ma sugli angoli il Villarreal ne ha battuti 3 contro una media di 7,3: la giocata ha retto solo perché il Real ha fatto i suoi 9. Un caso vinto non fa una regola, però il lato debole dichiarato si è visto.","daiNumeri":"Schedine chiuse 21: 11 vinte, 10 perse. Eventi per famiglia di mercato (conteggio automatico sul diario): esiti 5 su 9, gol 10 su 17, angoli 1 su 1. Sette vinte nelle ultime nove schedine. Campione sugli angoli troppo piccolo per spostare lo studio: si continua a contare."},{"data":"2026-10-12","giorno":26,"cosa":"Nessuna regola cambiata. Scelta di metodo applicata oggi: tra due letture sulla stessa gara che superano entrambe la quota, si blocca quella col margine contato più largo, non quella con la probabilità assoluta più alta (Malmö-Kalmar: No Gol +4,7 punti contro segno 1 +1,2).","perche":"Friburgo-Schalke vinto all'85' in dieci uomini con 1,1 punti di margine: le giocate a margine quasi nullo vincono ma tremano (3 su 5 sotto i 5 punti). Il No Gol con la prova contata sull'attacco dell'avversario è invece 5 su 5 e oggi il Kalmar offre proprio quella prova.","daiNumeri":"Schedine chiuse 22: 12 vinte, 10 perse. Eventi per famiglia: esiti 6 su 10, gol 10 su 17, angoli 1 su 1. Otto vinte nelle ultime dieci schedine. Saldo 104,29 € su 100: primo giorno sopra il capitale iniziale."},{"data":"2026-10-13","giorno":27,"cosa":"Nessuna regola cambiata. Nota di metodo applicata oggi: quando i modelli (Opta, Statz) danno alla favorita meno di quanto chiede la quota, la favorita resta INTERESSANTE anche se il nome è grosso (Inter 1,25, Arsenal 1,22, Wolves 1,40, Lipsia 1,75): niente doppia di favorite sottoprezzate solo per arrivare a 1,50.","perche":"Malmö-Kalmar vinto col metodo del margine contato più largo scelto ieri. Oggi le favorite di Champions pagano tutte meno della stima dei modelli (Arsenal 71-74,5% contro l'82% chiesto, Wolves 70% contro 71,4%, Birmingham 61% contro 62%, Lipsia 51% contro 57%): la doppia Inter+Arsenal a 1,52 avrebbe margine negativo su tutte e due le gambe.","daiNumeri":"Schedine chiuse 23: 13 vinte, 10 perse. Eventi per famiglia: esiti 6 su 10, gol 11 su 18, angoli 1 su 1. No Gol con prova sull'avversario 6 su 6. Nove vinte nelle ultime undici schedine."},{"data":"2026-10-14","giorno":28,"cosa":"Nessuna regola cambiata. Nota di metodo applicata oggi: con la favorita a quota bassa e forma pesata contraria (Stoccarda 1,30 ma 4 vittorie e 6 sconfitte nelle ultime 10 trasferte europee; Liverpool 1,28 con 3 vittorie nelle ultime 10) il nome non basta; si cerca la squadra di casa che non perde, se la prova è contata.","perche":"Atlético-United vinto col segno su favorita pagata più dei modelli (nota del 13/10): la regola regge. Oggi la stessa logica rovesciata boccia le due favorite più corte della giornata, entrambe con frequenze contate contro.","daiNumeri":"Schedine chiuse 24: 14 vinte, 10 perse. Eventi per famiglia: esiti 7 su 11, gol 11 su 18, angoli 1 su 1. Segno secco su favorita in casa: 4 su 4 (Curaçao, Cruzeiro, Friburgo, Atlético). Dieci vinte nelle ultime dodici schedine."},{"data":"2026-10-15","giorno":29,"cosa":"Nessuna regola cambiata. Nota di metodo applicata oggi: quando la lettura migliore sta fuori dal range di quota singola (Under 2.5 Torreense-Sunderland a 2,30, sopra il tetto di 2,10), non si allarga il range per un caso solo: si scende sulla linea vicina dentro il range (Under 3.5 a 1,53) se le frequenze contate la reggono meglio.","perche":"Bodø-Dortmund vinto 1-0 con la doppia chance sul fattore campo contato. Dodici partite su dodici dentro i range finora: nessun numero chiede di alzare il tetto a 2,30. La linea 3.5 regge in 7 delle 8 ufficiali del Sunderland e in 5 delle 6 note del Torreense.","daiNumeri":"Schedine chiuse 25: 15 vinte, 10 perse. Eventi per famiglia: esiti 8 su 12, gol 11 su 18, angoli 1 su 1. Undici vinte nelle ultime tredici schedine. Prima giocata su Under della stagione."},{"data":"2026-10-15","giorno":29,"cosa":"Ordine dell'utente (invariante, non evoluzione autonoma): l'esperimento non finisce al giorno 30, prosegue fino al giorno 60 (16/11/2026). Stesse regole: almeno una schedina al giorno, 10 € l'una, massimo 2, studio obbligatorio e mercati larghi.","perche":"Parole dell'utente del 15/10/2026: 'domani è il giorno 30... arriveremo al giorno 60, continua così, non ti cullare, continua a studiare e ad ampliare le tue conoscenze e giocare'.","daiNumeri":"Al giorno 29: saldo 132,39 € su 100, schedine 15 vinte e 10 perse, undici vinte nelle ultime tredici."},{"data":"2026-10-16","giorno":30,"cosa":"Taratura del giorno 30: nessuna regola cambiata. Nota di metodo applicata oggi: in un venerdì povero di gare, la doppia da due gambe corte (stima combinata 60% contro 58,3%) batte la singola a 2,05 su una favorita con difesa decimata e quattro gare senza vittoria. Il range totale 1,50-3,50 già in regole lo permette.","perche":"Torreense-Sunderland vinto 1-2 con l'Under 3.5 sulle frequenze contate. Dodici vinte nelle ultime quattordici schedine: il metodo regge, cambiarlo ora sarebbe nervosismo.","daiNumeri":"Schedine chiuse 26: 16 vinte, 10 perse. Eventi per famiglia: esiti 8 su 12, gol 12 su 19, angoli 1 su 1. Singole recenti dal 13/10: 3 su 3."},{"data":"2026-10-16","giorno":30,"cosa":"Ordine dell'utente (non evoluzione autonoma): i campionati di tutto il mondo diventano giro obbligatorio del palinsesto, non più facoltativo. Nasce `campionati` nel diario: una scheda per campionato con medie, squadre dominanti e fonti affidabili, da aggiornare ogni giorno.","perche":"Parole dell'utente del 16/10: \"studia più campionati nel mondo, non ti fermare qui, devi diventare un top player e sapere tutto di campionati, squadre e competizioni\".","daiNumeri":"Oggi 16 gare studiate in 13 campionati (al primo giro 4 in 4). Il giro largo ha trovato la seconda ALTA FIDUCIA in 2. Bundesliga (Kiel-Hertha DNB): prova che allargare serve a trovare."},{"data":"2026-10-17","giorno":31,"cosa":"Nessuna regola cambiata. Nota di metodo applicata oggi: le serie 'subisce sempre' e 'segna sempre' si contano escludendo la goleada più recente (mediana, non media), come già scritto per i team total dopo AZ-Telstar; oggi l'Over 2.5 di Southampton-Bolton passa il controllo anche senza il 4-0 di Millwall (Bolton fuori Over in 3 delle altre 3 contate).","perche":"Frankfurt-Köln perso 1-0: la difesa da 16 gol subiti poggiava su 0-6 e 1-4. Il DNB di Kiel ha rimborsato un pareggio previsto come rischio. Gol/Gol ora 2 vinti su 4 giocati: campione troppo piccolo per vietarlo, ma basta una conferma in più per alzarne la condizione.","daiNumeri":"Schedine chiuse 28: 16 vinte, 11 perse, 1 rimborsata. Eventi per famiglia: esiti 9 su 13 (più 1 rimborso), gol 12 su 20, angoli 1 su 1. Esiti con prova contata sul campo/trasferta: 6 su 6."},{"data":"2026-10-17","giorno":31,"cosa":"Ordine dell'utente (invariante, non evoluzione autonoma): niente più doppie, si giocano due singole da 5 € invece di una schedina da 10 €. La doppia S27-D31-A di oggi, bloccata alle 11 con Southampton-Bolton Over 2.5 e 2 Feyenoord a quota 1,86, è stata sciolta alle 12:25, tre ore e mezza prima del primo calcio d'inizio, in due singole da 5 € (S27-D31-A e S27-D31-B) con le stesse scelte e le stesse quote. Unica modifica di una schedina bloccata nella storia di SALA 27, autorizzata dall'utente in chat e fatta a gare non iniziate.","perche":"Parole dell'utente del 17/10: \"preferisco due schedine da 5 euro piuttosto che una da 10... così aumenti più le probabilità di perdita\". Le doppie hanno sommato due rischi: D30-A persa per una gamba sola con l'altra vinta.","daiNumeri":"Conti di oggi: doppia da 10 € = +8,62 se vincono entrambe (58%), -10 negli altri casi. Singole da 5 € = +3,65 se vincono entrambe (58%), circa -3 se ne vince una (37%), -10 se perdono entrambe (5%). La probabilità di chiudere il giorno in attivo resta 58%; cala la perdita quando sbaglia una gamba, cala anche la vincita piena."},{"data":"2026-10-17","giorno":31,"cosa":"Precisazione dell'utente (invariante): una sola partita da giocare si gioca singola da 10 € come sempre; con due partite si fanno due singole da 5 €; mai una schedina con più partite.","perche":"Parole dell'utente del 17/10: \"quando giochi una sola partita la giocherai da 10 come sempre, più partite più schedine da 5 euro, niente schedina unica\".","daiNumeri":"Oggi due partite, quindi restano le due singole da 5 € (S27-D31-A e S27-D31-B)."},{"data":"2026-10-18","giorno":32,"cosa":"Nuova condizione per l'Over 2.5 e i mercati gol 'alti': se la squadra che deve fare i gol arriva da almeno due porte inviolate di fila e da una media gol delle ultime tre sotto 1,5, la serie stagionale non basta; servono le ultime 3 di quella squadra sopra la linea in almeno 2 casi, altrimenti si scarta il mercato alto e si guarda al segno o all'Under.","perche":"Southampton-Bolton perso 0-0 con il trend recente (3 gol in 3, due clean sheet) scritto come lato debole e poi ignorato. Frankfurt-Köln perso 1-0 il giorno prima per lo stesso motivo rovesciato: la serie lunga gonfiata, il trend corto opposto. Due mercati gol persi di fila sul trend corto.","daiNumeri":"Schedine chiuse 30: 17 vinte, 12 perse, 1 rimborsata. Eventi per famiglia: esiti 10 su 14 (più 1 rimborso), gol 12 su 21, angoli 1 su 1. Gol nelle ultime 5 giocate: 2 su 5; esiti nelle ultime 5: 4 su 4 più 1 rimborso."},{"data":"2026-10-19","giorno":33,"cosa":"Il trend corto vale anche per l'Under: niente Under (2.5 o 3.5) se una delle due squadre ha subito almeno 2 gol a gara nelle ultime 5 di tutte le competizioni oppure ha segnato almeno 2 gol a gara nelle ultime 5; le frequenze di Under si contano su tutte le competizioni recenti, non sul solo campionato. Se il lato debole scritto nel motivo è un trend corto contrario al mercato, la giocata si scarta: non si scrive un rischio per poi ignorarlo.","perche":"Celtic-Hearts Under 3.5 perso 7-1 con 11 gol subiti dal Celtic nelle ultime 5 scritti come lato debole. È la terza giocata gol persa in tre giorni con il lato debole già scritto nel motivo e contrario al mercato (Frankfurt-Köln, Southampton-Bolton, Celtic-Hearts).","daiNumeri":"Schedine chiuse 32: 18 vinte, 13 perse, 1 rimborsata. Eventi per famiglia: esiti 11 su 15 (più 1 rimborso), gol 12 su 22, angoli 1 su 1. Mercati gol nelle ultime 6 giocate: 2 su 6; esiti nelle ultime 6: 5 su 5 più 1 rimborso. Under giocati: 1 su 2 (Torreense vinto, Celtic perso)."},{"data":"2026-10-20","giorno":34,"cosa":"Ordine dell'utente (invariante, non evoluzione autonoma): obiettivo dell'esperimento raddoppiare il saldo iniziale, 200 € entro il 15/11/2026, pena la chiusura anticipata di SALA 27. Basta fissazione sull'Under: Under 2.5 e Under 3.5 vietati; mai lo stesso mercato due giorni di fila; ogni giorno si cerca la giocata su tutte le famiglie (segno, doppia chance, DNB, handicap, team total, angoli, cartellini, giocatori) e i mercati gol totali sono l'ultima scelta, non la prima. Per arrivare a 200 € la singola da 10 € va giocata a quota 1,70-2,30 (prima minimo 1,50).","perche":"Parole dell'utente del 20/10: \"hai rotto con questo under 2.5, non ne stai prendendo più una, ti ho detto che puoi giocare qualsiasi cosa... per sopravvivere e continuare il tuo obiettivo è raddoppiare il saldo iniziale\".","daiNumeri":"Schedine chiuse 33: 18 vinte, 14 perse, 1 rimborsata; saldo 111,09 €. Per famiglia: esiti 11 su 15 più 1 rimborso (73%), gol 12 su 23 (52%), Under 1 su 3, angoli 1 su 1. Mercati gol nelle ultime 7 giocate: 2 su 7; esiti nelle ultime 7: 5 su 5 più 1 rimborso. Conti per i 200 €: servono +88,91 € in 26 giorni, circa +3,40 € al giorno; con la singola da 10 € serve probabilità × quota ≥ 1,34: a quota 1,53 vuol dire vincere l'88%, a 1,80 il 75%, a 2,00 il 67%. Con il 73% degli esiti la quota che regge è 1,85-2,00."},{"data":"2026-10-21","giorno":35,"cosa":"Taratura dei 5 giorni: nessuna modifica alle soglie. Confermato l'ordine del 20/10 (esiti prima, quota 1,70-2,30 per la singola da 10 €, mai lo stesso mercato due giorni di fila). Oggi il segno e i DNB delle favorite stanno tutti sotto la stima o fuori range, quindi si gioca il Gol, famiglia gol ma non gol totali, che il diario non ha mai giocato due giorni di fila.","perche":"Dal 17/10 (D31-D34): esiti 3 su 3 (Feyenoord 2, Salzburg 1, Roma -2), gol 0 su 3 (Southampton Over, Celtic Under 3.5, Newell's Under). Il buco era l'Under e l'Over giocati contro il trend corto, già coperti dalle regole del 18-19/10 e dal divieto dell'utente.","daiNumeri":"Schedine chiuse 34: 19 vinte, 14 perse, 1 rimborsata; saldo 121,09 €. Per famiglia: esiti 12 su 16 più 1 rimborso (75%), gol 12 su 23 (52%), angoli 1 su 1. Stime dei mercati gol persi dal 17/10: 70% (Celtic), 70% (Newell's), esiti vinti 80 (Salzburg) e 52 (Roma): i gol erano stimati troppo alti. Correzione: sui mercati gol la stima si abbassa di 3 punti rispetto al modello quando una sola delle due squadre dà la prova contata; soglie invariate."},{"data":"2026-10-24","giorno":38,"cosa":"Gol/No Gol e combo che li contengono (vince a zero, 1+Gol): la prova sulla squadra che deve segnare o restare a secco vale solo se lo split casa/trasferta e il totale stagionale dicono la stessa cosa, e lo split conta almeno 6 gare (anche dalla stagione precedente). Uno split di 3-4 gare contraddetto dal totale non regge un giudizio sopra INTERESSANTE.","perche":"Due Gol/No Gol persi di fila sullo stesso difetto: Inter-Shakhtar (Gol, Shakhtar a segno 5,89 € dopo S27-D45-A. Vinte 26, perse 19. Esiti dal 21/10: 5 vinti, 2 rimborsati, 1 perso."},{"data":"2026-11-01","giorno":46,"cosa":"ORDINE DELL'UTENTE: handicap asiatico al massimo uno ogni 5 giorni e solo a linea intera; vietati quarti di gol (-0.25, -1.25, -1.75...) e mezze linee (-1.5, +1.5). Prossimo handicap ammesso non prima del 06/11.","perche":"L'utente: \"questo handicap asiatico su ogni partita non mi sta piacendo\". Scelta 2 tra le tre proposte.","daiNumeri":"Handicap giocati: 6 (Roma -2, Estudiantes +1.5, Lazio -0.25, Sporting -1.5 vinti; Celtic -1 rimborsato; Lazio -1.25 in attesa), 4 dei quali negli ultimi 13 giorni: il mercato rende, ma era diventato il ripiego fisso."},{"data":"2026-11-02","giorno":47,"cosa":"Nessun cambio di regole. Revisione: con l'handicap sospeso fino al 06/11 il ripiego sulla favorita a quota bassa è la combo segno + Over 1.5 (non contiene Gol/No Gol), scelta solo se l'avversaria subisce almeno 2 gol nella maggior parte delle trasferte, così che l'1-0 sia il tabellino meno probabile tra quelli vincenti.","perche":"Ultimi quattro giorni: Frosinone segna per primo vinto, Sporting -1.5 vinto, Preston under angoli perso, Lazio -1.25 perso a metà. Esiti puri sulla favorita giusti 4 su 4 come lettura; le perdite vengono dalle linee aggiunte (mezzo angolo, quarto di gol).","daiNumeri":"Vinte 26 / perse 20 dopo la chiusura di oggi; saldo prima della giocata 95,89 € (Lazio contata persa intera)."},{"data":"2026-11-02","giorno":47,"cosa":"ORDINE DELL'UTENTE: vietate tutte le combo, un solo esito semplice per partita; la schedina S27-D47-A già bloccata (1 + Over 1.5 a 1,75) è stata rifatta in 1 Atalanta a 1,50 su ordine esplicito e ribloccata. Range della singola da 10 € portato a 1,50-2,30.","perche":"L'utente: \"basta combo le perdi quasi tutte, solo un risultato sicuro sulle partite\" e \"non studi e giochi per vincere ma lo fai tanto per farlo\". Il range 1,70-2,30 del 20/10 spingeva verso linee e combo aggiunte per alzare la quota. Ultimi esiti sulla favorita con reparto sano: Barcellona team total vinto."},{"data":"2026-11-04","giorno":49,"cosa":"ORDINE DELL'UTENTE: attivata da oggi, in prova, la fascia 1,30-1,50 per una delle due singole da 5 €, con margine minimo di 8 punti sulla quota. Autorizzata anche la modifica della S27-D49-A già bloccata, nel caso servisse a dividere la giornata in due singole da 5 €.","perche":"L'utente: \"si proviamo la fascia 1.30-1.50, rendi attiva la modifica già oggi\". Sotto 1,50 il pareggio chiede 67-77% di vittorie; con 8 punti di margine la fascia ha valore atteso positivo solo se le stime sono calibrate.","daiNumeri":"Esiti nel diario intorno al 75-78% (14 su 18 più 2 rimborsi al 26/10). Oggi nessuna gara della fascia arriva a +8: Viking 1,38 (modello 70 contro 72,5), Over 2,5 Fenerbahçe-Liverpool 1,37 (modelli 66-72 contro 73), Over 2,5 Lipsia-City 1,30 (68-74 contro 77), DNB Dortmund 1,30 (72 contro 77), DNB Porto 1,33 (70 contro 75), segno Liverpool 1,42-1,45 vietato dal filtro delle assenze. La S27-D49-A resta singola da 10 €, invariata."},{"data":"2026-11-05","giorno":50,"cosa":"Angoli di squadra (over) sulla favorita in trasferta: ammessi solo se l'avversario in casa tiene meno del 52% di possesso e la media della favorita è contata contro avversari di fascia simile. Con un padrone di casa che gioca la palla, niente over angoli della favorita.","perche":"Angoli nel diario: 2 vinti (Over 9,5 totale, Como over 4,5) e 2 persi (Preston under 3,5, City over 5,5). Il City perso aveva il lato debole del possesso del Lipsia (56%) scritto nel motivo: è la seconda giocata persa con il lato debole scritto e ignorato. Como vinto contro un Torino che non tiene palla.","daiNumeri":"Angoli 2 su 4; over di squadra 1 su 2; City 3 angoli contro 8,4 di media fuori."},{"data":"2026-11-06","giorno":51,"cosa":"Nessuna modifica. Annotato: con il segno vietato per il mercato del giorno prima, le favorite nette del venerdì offrono solo DNB a 1,40 (fascia bassa) o mezze linee (DNB, doppia chance), e un handicap -1 non si gioca contro un avversario che segna con regolarita.","perche":"FASE 2: 3V 6P. Quattro perse su sei hanno il pareggio dentro (Polonia 1-1, Mallorca 1-1, Monaco 1-1, PSG 2-2); DNB 1V 0P. Le due perse rimanenti sono una favorita sbagliata (Internacional) e un handicap contro la favorita (Millonarios).","daiNumeri":"Saldo 55,14 € prima della chiusura, 50,14 € dopo PSG-Roma. Stime corrette FASE 2: 47, 59, 58, 70, 65, 63, 59, 58, 61 (media 60,0) contro 33,3% reale. Controllo CLV al giorno 72."}],"lezioni":[{"data":"2026-09-19","schedinaId":"S27-D03-A","partita":"Brighton — Arsenal","lezione":"Brighton 3-0. L'Arsenal a punteggio pieno con 3 clean sheet su 4 è stato travolto dalla squadra che avevo dato per decimata dagli infortuni offensivi: le assenze del Brighton erano in attacco, ma le mie (Saliba e Mosquera, i due centrali) erano in difesa, e ho pesato le loro più delle mie. Lezione doppia: quando entrambe le squadre hanno assenze, conta DOVE sono, non quante sono; e una gara con due difese rimaneggiate era il quadro perfetto per un Over 2.5 (finita 3-0, sarebbe passato), non per un segno."},{"data":"2026-09-19","schedinaId":"S27-D03-A","partita":"Nottingham Forest — Coventry City","lezione":"Forest 0-1, con gol annullato dal VAR ai padroni di casa. Tutto il mio ALTA FIDUCIA poggiava su 'il Coventry non ha ancora segnato in campionato ed è senza il suo bomber squalificato': ha segnato e ha vinto. Una prova contata che dice 'questa squadra NON fa una cosa' è la più fragile di tutte, perché basta un episodio a smentirla, mentre una prova che dice 'questa squadra fa sempre una cosa' regge molto meglio. D'ora in poi le prove per negazione (mai segnato, mai vinto, mai subito) valgono la metà di quelle per affermazione."},{"data":"2026-09-19","schedinaId":"S27-D03-B","partita":"Kilmarnock — Heart of Midlothian","lezione":"1-1, e il pareggio è arrivato all'86' con gol di Kingsley. La lettura era giusta nella sostanza (gli Hearts dia generale. Nota onesta: sul 3-0 avrebbe vinto anche l’Over 2.5, ma il No Gol pagava di più e aveva 6,5 punti di margine invece di 2. Si continua a scegliere il mercato per margine contato, non per abitudine."},{"data":"2026-09-20","schedinaId":"—","tipo":"osservazione","partita":"SALA 30 · S30-D07-SALA (video mandato dall’utente)","lezione":"Letta la schedina di SALA 30 fotogramma per fotogramma. Giorno 07/30, importo 10 € VIRTUALI, quote indicative: Liverpool vincente 2,05 a Bournemouth e Juventus vincente 1,63 con l’Atalanta, quota totale 3,34, ritorno potenziale 33,42 €. Finite 0-1 Liverpool e 2-0 Juventus: schedina vinta, +23,42 €. Tre differenze vere, non alibi: (1) lui punta 10 € contro i miei 5 e accetta quota totale 3,34, sopra il mio tetto di 3,00; (2) gioca 1X2 puro, cioè il mercato che io evito per regola; (3) quella schedina non l’ha scelta lui ma il voto dei follower (\"SCHEDINA 02 · DECISIONE DEI FOLLOWER · STATO: SCELTA DAL VOTO\"), e la sua stessa didascalia dice \"SALA30-ROBETTO 1-0\", cioè la community sta battendo l’autore. Prima di cambiare metodo per imitazione ho contato i miei numeri: sui 12 eventi chiusi, 1X2 3 vinti e 4 persi (43%), mercati sui gol 3 vinti e 2 persi (60%). I dati dicono che il mio problema non è evitare il segno secco: è la qualità delle singole letture. Una giornata vinta da altri non è un numero: è una giornata."},{"data":"2026-09-21","schedinaId":"S27-D04-A","tipo":"conferma","partita":"Toluca — Santos Laguna","lezione":"Over 2.5 vinto: 2-3 (Toluca 2-0 al 43', Santos a segno all'86' e al 95'). Lettura per frequenze contate (Toluca Over 2.5 nelle ultime 5 interne, Santos 9 gol subiti in 3 incroci) confermata sui gol; il Toluca ha perso ma il mercato sui gol non chiedeva il vincitore, esattamente il punto della regola. Probabilità stimata 73% contro 64% della quota: calibrazione ok, campione piccolo."},{"data":"2026-09-22","schedinaId":"S27-D05-A","partita":"Lanús — Estudiantes","lezione":"No Gol perso: 2-1, con Lanús avanti 2-0 già all'13' (testa di Lobos, rigore di Salvio) e González Pírez che ha accorciato al 39'. Le prove contate (No Gol in 8 delle ultime interne del Lanús, in 5 delle ultime esterne dell'Estudiantes) guardavano al quadro medio, non al possibile avvio fulmineo: un rigore nei primi minuti cambia lo scenario e spinge la squadra in vantaggio ad amministrare, aprendo spazi che l'avversario può sfruttare per accorciare senza che questo tolga nulla al 2-0. Il mercato in sé restava quello giusto (nessuna scelta di vincitore), ma la lettura non teneva conto di quanto un episodio da area (rigore) possa bucare una difesa altrimenti solida: va pesato di più il rischio rigore/episodio quando si conta 'No Gol' su squadre con buon possesso ma non impenetrabili."},{"data":"2026-09-24","tipo":"osservazione","schedinaId":null,"partita":"SALA 30 — cruscotto di Robetto","lezione":"Letti i tre video di SALA 30 del 24/09. Il cruscotto di Robetto (day 10, 20 giorni rimanenti) mostra \"NESSUNA FORZATURA. CAPITALE PROTETTO. 22 SET · NO BET + 23 SET · NO BET\": nei due giorni di sosta ha fatto NO BET anche lui, come me. Capitale 210,69 € (+110,69), record 7 vinte e 4 perse. La lezione vera è sul day 08 (lunedì 21/09): \"TRE SCELTE. TRE ESITI PRESI\", Trento 1, Guidonia X e Spezia 1, tutte di Serie C. Io quel giorno avevo Trento-Pro Vercelli e Spezia-Vis Pesaro in palinsesto: il Trento l'ho scartato perché era un 1X2 (regola vecchia, prima del metodo Robetto), sullo Spezia ho guardato l'Over 2.5 invece del segno, e ho giocato Lanús-Estudiantes No Gol, perso. Nei giorni di campionato minore italiano il segno sulla favorita di Serie C va studiato per primo, non dopo i mercati gol."},{"data":"2026-09-25","tipo":"osservazione","schedinaId":null,"partita":"Nations League, giornata 1","lezione":"NO BET vuol dire 'ho cercato e non c'è margine', non 'non ho cercato'. Il 24/09 ho scartato sei nazionali senza aprire un risultato. Il 25/09 ho fatto lo stesso sulle prime sei, e l'utente me l'ha rinfacciato. Rifatto lo studio, la Svezia aveva 9 Gol/Gol su 10: il dato c'era, bastava contarlo. Un NO BET va motivato con numeri, come un ALTA FIDUCIA."},{"data":"2026-09-26","schedinaId":"S27-D09-A","tipo":"conferma","partita":"Svezia — Romania","lezione":"Gol/Gol vinto 2-1 (Isak 20', Man 29', Gyökeres 43'). Lettura giusta: la Svezia senza Hien ha preso gol per l'undicesima volta di fila, la Romania ha segnato in trasferta come nelle 5 delle ultime 6. Mercato giusto: sul 2-1 avrebbe vinto anche l'Over 2.5, ma il Gol/Gol era il mercato con le frequenze contate più alte (9 su 10). Stima 66% contro 58,5%: calibrazione coerente, un solo evento non dimostra altro. La conferma vera è di metodo: le nazionali, studiate con i numeri invece che scartate per paura, hanno dato la prima vincita della settimana."},{"data":"2026-09-27","schedinaId":"S27-D10-A","partita":"Cittadella — Lecco","lezione":"Under 2.5 perso 3-0: primo tempo bloccato come previsto, poi il Cittadella a punteggio pieno ha cambiato passo e ne ha fatti tre in mezz'ora. Lettura giusta sulla superiorità, mercato sbagliato: con una capolista a 7 su 7 contro un'avversaria in calo il segno 1 sopravviveva anche al 3-0, l'Under no. Contro la favorita netta l'Under scommette sulla sua pigrizia: si gioca solo se anche la favorita segna poco, non solo se subisce poco."},{"data":"2026-09-27","schedinaId":null,"partita":"SALA 30 — giorno 12/13 di Robetto","lezione":"Video di SALA 30 del 27/09: il giorno 12 Robetto ha perso con tre mercati sui corner in tre partite e li chiamava diversificazione; lui stesso ammette che era la stessa ipotesi ripetuta tre volte. La community (La Sala) ha vinto la sua schedina da 10 € (24,41 € di ritorno, +14,41) con tre famiglie diverse: Entrambe segnano su Inghilterra-Spagna (2-3), un esito su Cechia-Croazia (1-0), Svizzera più corner in Macedonia del Nord-Svizzera. Conferma la nostra regola contro la monocoltura: la diversificazione vera si fa sulle famiglie di mercato, non sulle partite. Tre gambe con la stessa ipotesi sono una gamba sola moltiplicata per tre."},{"data":"2026-09-28","schedinaId":"S27-D11-A","tipo":"conferma","partita":"Curaçao — Nicaragua","lezione":"Segno 1 vinto 6-1 (cinque gol nel primo tempo, doppietta di Gorré). Lettura giusta: Curaçao imbattuto in casa contro una Nicaragua che fuori perde quasi sempre. Mercato giusto: anche l'Over 2.5 scartato sarebbe passato, ma il segno reggeva pure un 1-0. Stima 79% contro 72,5%: calibrazione prudente, il divario era perfino più largo. Conferma del metodo Robetto: favorita netta, prove contate per affermazione, singola quando la seconda gamba non c'è."},{"data":"2026-10-02","schedinaId":"S27-D15-A","tipo":"conferma","partita":"Azerbaigian — Liechtenstein","lezione":"0-0. Lettura giusta (Liechtenstein a secco, Azerbaigian che segna poco), mercato giusto: il No Gol vinceva per due strade e l'1 Azerbaigian sarebbe morto sul pareggio. Stima 82% coerente con una gara senza un tiro pericoloso: le prove per affermazione ('a secco in 7 delle ultime 8 trasferte') hanno retto."},{"data":"2026-10-04","schedinaId":"S27-D17-A","partita":"Cittadella — AlbinoLeffe","lezione":"No Gol perso 1-2: Desogus al 30', Sottini al 45', rigore di Paolucci al 56'. La lettura guardava un lato solo: le prove erano tutte sulla difesa del Cittadella (5 porte inviolate su 7), nessuna sull'attacco dell'AlbinoLeffe, che aveva segnato 10 gol in 7 ed era rimasto a secco solo 2 volte. Un No Gol che si regge sulla sola difesa della favorita chiede all'avversario di non fare ciò che fa di solito. Stima 64 contro un esito che ha punito proprio il dato non contato. Seconda capolista imbattuta che inciampa sul mercato contro la sua natura nel giro di otto giorni (Lecco-Under, ora AlbinoLeffe-No Gol): con il Cittadella si chiude."},{"data":"2026-10-05","schedinaId":"S27-D18-A","tipo":"conferma","partita":"Malta — Andorra","lezione":"No Gol vinto 1-0 (Teuma al 49'). Lettura giusta: l'Andorra è rimasta a secco per la sesta trasferta di i Savarino, Lucho Acosta al 92'), 22 tiri a 8. Lettura giusta: la difesa del Coritiba è rimasta quella che era, quinta gara di fila con gol subiti, 17 nelle ultime cinque. Mercato giusto: il Gol/Gol scartato sarebbe morto sul clean sheet, l'1 a 1,53 sarebbe passato ma pagava 4 punti meno. Stima 56 contro 51,5: prudente, il divario era più largo. Le prove contate su entrambi i lati continuano a reggere."},{"data":"2026-10-10","schedinaId":"S27-D23-A","partita":"West Ham — QPR","lezione":"Over 2.5 perso 1-1 (Madsen su rigore al 18', Bowen al 70', rigore di Bowen parato da Charles al 91'). Lettura a metà: il West Ham ha segnato come sempre, ma il QPR ha portato la gara nel suo ritmo, quello di una squadra da Under fuori casa (Over 2 su 5 in trasferta). L'avevo scritto io stesso tra le prove come 'lato debole' e ho giocato lo stesso con 0,6 punti di margine. Mercato sbagliato: l'Over chiede gol a tutte e due, e una delle due non li porta. Il rigore parato al 91' è sfortuna, il margine a zero no."},{"data":"2026-10-11","schedinaId":"S27-D24-A","tipo":"conferma","partita":"Barcellona — Getafe","famiglia":"gol (No Gol)","datoDecisivo":"attacco dell'avversario contato gara per gara: Getafe zero gol in trasferta, a secco in 7 delle ultime 10 visite","lezione":"No Gol vinto 3-0 (Gordon 2', Gabriel Jesus 30', Koundé 73'). Lettura giusta: il Getafe è rimasto quello che era, quarta trasferta su quattro senza segnare. Mercato giusto: l'handicap -2,5 scartato sarebbe passato di un soffio, il No Gol non ha mai tremato dopo il 2'. Stima 63 contro 60,6: prudente. Quinta vittoria su cinque per il No Gol con la prova sull'attacco dell'avversario."},{"data":"2026-10-11","schedinaId":"S27-D24-B","tipo":"conferma","partita":"Real Madrid — Villarreal","famiglia":"calci d'angolo (Over 9,5)","datoDecisivo":"angoli battuti gara per gara dalle due squadre (51 e 48 in 7 gare) contro la linea","lezione":"Over 9,5 angoli vinto con 12 (9 Real, 3 Villarreal; sofascore, espn), gara finita 1-0 con Di
